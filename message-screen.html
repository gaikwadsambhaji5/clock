<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Message Dashboard</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212; 
      color: white;
      text-align: center;
      overflow: hidden;
    }

    #message-container {
      padding: 40px;
      font-size: 5rem; 
      font-weight: bold;
      word-wrap: break-word;
      max-width: 90%;
    }

    /* Red and Black Blinking Animation */
    .urgent-blink {
      animation: blinker 0.8s linear infinite;
    }

    @keyframes blinker {
      0% { background-color: black; color: white; }
      50% { background-color: red; color: white; }
      100% { background-color: black; color: white; }
    }
  </style>
</head>
<body>

  <div id="message-container">Waiting for messages...</div>

  <script>
    const APP_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwxyjcMeYoTsnYB7n59enTjMDm10ltMwcEY2nEvB0XEA8Wi-UoOtiU2V-O-928EyxgY/exec';
    
    let lastTimestamp = "";

    async function fetchLatestMessage() {
      try {
        const response = await fetch(APP_SCRIPT_URL);
        const data = await response.json();

        if (data.message !== "No messages yet" && data.timestamp !== lastTimestamp) {
           lastTimestamp = data.timestamp;
           updateScreen(data.category, data.message);
        }
      } catch (error) {
        console.error("Error fetching message:", error);
      }
    }

    function updateScreen(category, messageText) {
      const container = document.getElementById('message-container');

      // Convert category to lowercase to ensure it matches perfectly
      const isHighPriority = category.toLowerCase() === "very high";

      if (isHighPriority) {
        // High Priority: Turn on blinking and add 'H'
        document.body.className = "urgent-blink";
        container.innerText = "H - " + messageText;
      } else {
        // Normal Priority: Turn off blinking and add 'L'
        document.body.className = ""; 
        container.innerText = "L - " + messageText;
      }
    }

    setInterval(fetchLatestMessage, 3000);
  </script>

</body>
</html>
