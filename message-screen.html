<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Message Dashboard</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212; 
      color: white;              
      text-align: center;
      overflow: hidden;
      /* Add a smooth transition when returning to normal background */
      transition: background-color 0.3s; 
    }

    #message-container {
      padding: 20px;
      font-weight: bold;
      word-wrap: break-word;
      width: 95vw;
      max-height: 95vh;
      line-height: 1.1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Red and White Blinking Animation for High Priority */
    .urgent-blink {
      animation: blinker 0.4s linear infinite;
    }

    @keyframes blinker {
      0% { background-color: red; color: white; }
      50% { background-color: white; color: red; }
      100% { background-color: red; color: white; }
    }
  </style>
</head>
<body>

  <div id="message-container">Waiting for messages...</div>

  <script>
    const APP_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwxyjcMeYoTsnYB7n59enTjMDm10ltMwcEY2nEvB0XEA8Wi-UoOtiU2V-O-928EyxgY/exec';
    
    let lastTimestamp = "";
    let hideTimer; // This variable holds our countdown timer

    async function fetchLatestMessage() {
      try {
        const response = await fetch(APP_SCRIPT_URL);
        const data = await response.json();

        if (data.message !== "No messages yet" && data.timestamp !== lastTimestamp) {
           lastTimestamp = data.timestamp;
           updateScreen(data.category, data.message);
        }
      } catch (error) {
        console.error("Error fetching message:", error);
      }
    }

    function updateScreen(category, messageText) {
      const container = document.getElementById('message-container');
      
      // Stop any existing timer so they don't accidentally hide the NEW message early
      clearTimeout(hideTimer);
      
      const isHighPriority = category === "H";

      if (isHighPriority) {
        document.body.className = "urgent-blink";
        // 10 minutes = 600,000 milliseconds
        hideTimer = setTimeout(returnToHomeScreen, 600000); 
      } else {
        document.body.className = ""; 
        // 5 minutes = 300,000 milliseconds
        hideTimer = setTimeout(returnToHomeScreen, 300000); 
      }
      
      container.innerText = messageText;
      adjustFontSize(container);
    }

    // Function to hide the message and reset the screen
    function returnToHomeScreen() {
      const container = document.getElementById('message-container');
      
      // Clear the text and stop blinking
      container.innerText = "Waiting for messages...";
      document.body.className = ""; 
      
      // Reset the font size to something normal for the idle screen
      container.style.fontSize = "5rem"; 
      
      // Clear the timer (important if this was triggered by a screen tap)
      clearTimeout(hideTimer);
    }

    function adjustFontSize(element) {
      let fontSize = 400; 
      element.style.fontSize = fontSize + 'px';
      
      while ((element.scrollHeight > window.innerHeight * 0.95 || element.scrollWidth > window.innerWidth * 0.95) && fontSize > 12) {
        fontSize -= 5;
        element.style.fontSize = fontSize + 'px';
      }
    }

    window.addEventListener('resize', () => {
       // Only adjust font size if a custom message is currently showing
       if (document.getElementById('message-container').innerText !== "Waiting for messages...") {
           adjustFontSize(document.getElementById('message-container'));
       }
    });

    // LISTENER: If you click or tap anywhere on the screen, hide the message immediately
    document.body.addEventListener('click', returnToHomeScreen);
    document.body.addEventListener('touchstart', returnToHomeScreen);

    setInterval(fetchLatestMessage, 3000);
  </script>

</body>
</html>
