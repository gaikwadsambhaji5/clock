<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Commute Tracker - Professional</title>
    <link rel="icon" href="data:,">
    <style>
        :root {
            --bg-color: #ffffff; 
            --container-bg: #000000; 
            --cyan-accent: #00ffea;
            --yellow-accent: #FFCC00; 
            --progress-green: #32cd32; 
            --progress-grey: #e0e0e0;
            --text-light: #ffffff;
            --dot-color: #999;
            --large-red: #ff3b30;
        }

        body {
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .main-wrapper {
            width: 95vw;
            max-width: 1000px;
            text-align: center;
        }

        .info-container {
            background-color: var(--container-bg);
            border-radius: 20px;
            padding: 50px 40px;
            margin-bottom: 70px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            color: var(--text-light);
            text-align: center;
        }

        .header-bar {
            width: 50%;
            margin: 0 auto 30px auto;
            border-radius: 15px;
            padding: 15px 0;
            transition: background-color 0.4s ease;
        }

        .header-text {
            color: #000; 
            font-size: 32px; 
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .big-stop-name {
            font-size: 75px; 
            font-weight: 900;
            margin: 15px 0;
            transition: color 0.4s ease;
        }

        .separator {
            width: 80%;
            height: 2px;
            background-color: rgba(255,255,255,0.3);
            margin: 30px auto;
        }

        .info-label {
            font-size: 26px; 
            color: var(--text-light);
            margin: 0 0 5px 0;
        }

        .info-value {
            font-size: 32px; 
            font-weight: bold;
            color: var(--text-light);
            margin: 0;
        }

        /* State-based styling */
        .arrived .header-bar { background-color: var(--cyan-accent); }
        .arrived .big-stop-name { color: var(--cyan-accent); }
        .arrived .overhead-dot { background-color: var(--large-red); border-color: #ffb3b0; }

        .transit .header-bar { background-color: var(--yellow-accent); }
        .transit .overhead-dot { background-color: var(--yellow-accent); border-color: #ffe680; }

        @keyframes text-breathe {
            0% { color: #FFCC00; text-shadow: 0 0 5px rgba(255, 204, 0, 0.2); }
            50% { color: #997a00; text-shadow: 0 0 0px rgba(255, 204, 0, 0); }
            100% { color: #FFCC00; text-shadow: 0 0 5px rgba(255, 204, 0, 0.2); }
        }

        .transit .big-stop-name { 
            animation: text-breathe 2.5s infinite ease-in-out;
        }

        /* Progress Bar Section */
        .progress-section {
            width: 90%; 
            margin: 0 auto;
            position: relative;
            height: 100px;
        }

        .progress-base-line {
            width: 100%;
            height: 12px;
            background-color: var(--progress-grey);
            border-radius: 6px;
            position: absolute;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
            z-index: 1;
        }

        .progress-filled-line {
            height: 12px;
            background-color: var(--progress-green);
            border-radius: 6px;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 2;
            width: 0%;
            transition: width 0.4s ease;
        }

        .progress-transit-line {
            height: 12px;
            background-color: var(--yellow-accent);
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 2;
            width: 0%;
            opacity: 0;
        }

        .dots-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 3;
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }

        .dot-wrapper {
            position: absolute;
            top: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: translateX(-50%);
            height: 100%;
        }

        .track-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 3px solid var(--dot-color);
            background-color: white;
            z-index: 3;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            transition: background-color 0.4s ease, border-color 0.4s ease;
        }

        .dot-wrapper.current .track-dot {
            width: 24px;
            height: 24px;
            border-width: 5px;
            border-color: var(--progress-green);
            background-color: var(--progress-green);
            animation: pulse-green 1.5s infinite;
        }

        .dot-wrapper.visited .track-dot {
            border-color: var(--progress-green);
            background-color: var(--progress-green);
            width: 16px;
            height: 16px;
        }

        .overhead-indicator {
            position: absolute;
            top: -45px; 
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.4s ease, left 0.4s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 5;
        }

        .overhead-indicator::after {
            content: '';
            width: 2px;
            height: 25px;
            background-color: #ccc;
            margin-top: 5px;
        }

        .overhead-dot {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 4px solid var(--text-light);
            z-index: 5;
            transition: background-color 0.4s ease, border-color 0.4s ease;
        }

        @keyframes pulse-green {
            0% { box-shadow: 0 0 0 0 rgba(50, 205, 50, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(50, 205, 50, 0); }
            100% { box-shadow: 0 0 0 0 rgba(50, 205, 50, 0); }
        }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(255, 59, 48, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0); }
        }
        @keyframes pulse-yellow {
            0% { box-shadow: 0 0 0 0 rgba(255, 204, 0, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(255, 204, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 204, 0, 0); }
        }

        .arrived .overhead-dot { animation: pulse-red 1.5s infinite; }
        .transit .overhead-dot { animation: pulse-yellow 1.5s infinite; }

        /* End Labels */
        .end-labels-container {
            width: 100%;
            position: absolute;
            bottom: -40px;
            left: 0;
            font-size: 22px;
            font-weight: bold;
            color: #000;
        }
        .start-label {
            position: absolute;
            left: 0;
            transform: translateX(-50%);
            text-align: center;
        }
        .end-label-text {
            position: absolute;
            right: 0;
            transform: translateX(50%);
            text-align: center;
        }
    </style>
</head>
<body class="arrived">

    <div class="main-wrapper" id="main-ui">
        <div class="info-container" id="status-panel">
            <div class="header-bar">
                <div class="header-text" id="status-text">सध्याचे ठिकाण:</div>
            </div>
            <h1 class="big-stop-name" id="stop-name">लोड होत आहे...</h1>
            <div class="separator"></div>
            <div class="info-line">
                <p class="info-label" id="next-stop-label">पुढील स्टॉप:</p>
                <p class="info-value" id="next-stop-value">लोड होत आहे...</p>
            </div>
        </div>

        <div class="progress-section">
            <div class="progress-base-line"></div>
            <div class="progress-filled-line" id="filled-line"></div>
            <div class="progress-transit-line" id="transit-line"></div>
            
            <div class="dots-container" id="dots-container">
                <div class="overhead-indicator" id="overhead-dot-indicator">
                    <div class="overhead-dot"></div>
                </div>
            </div>

            <div class="end-labels-container">
                <div class="start-label" id="bottom-left-label">लोड होत आहे...</div>
                <div class="end-label-text" id="bottom-right-label">लोड होत आहे...</div>
            </div>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycby4JWDHSouc5Unp9TzZi3u1AZqcbiY4pgvbUQ1srGiHVykBFyaVM1oAbqU2qQXltawPGw/exec";

        let locations = [];
        let excelRow1 = [];
        let mapInitialized = false;
        
        let storedIndex = localStorage.getItem('myCommuteLastIndex');
        let lastKnownIndex = storedIndex !== null ? parseInt(storedIndex) : -1;
        let currentTransitState = -1; 
        
        let currentDirection = localStorage.getItem('myCommuteDirection') || 'forward';

        async function fetchLiveData() {
            try {
                let currentUrl = WEB_APP_URL + "?t=" + new Date().getTime();
                let response = await fetch(currentUrl, { cache: "no-store" });
                let rawText = await response.text(); 

                try {
                    let data = JSON.parse(rawText); 
                    if (!data.names || !data.status) return;

                    // --- STRICT INDEX FILTER ---
                    // It specifically checks Columns A (0), C (2), E (4), F (5), G (6)
                    const targetColumns = [0, 2, 4, 5, 6]; 
                    
                    let cleanLocations = [];
                    let cleanStatus = [];

                    for (let colIndex of targetColumns) {
                        if (data.names.length > colIndex) {
                            cleanLocations.push(data.names[colIndex] ? data.names[colIndex].toString().trim() : "");
                            cleanStatus.push(data.status[colIndex] === "" || data.status[colIndex] === undefined ? 0 : parseInt(data.status[colIndex]));
                        }
                    }

                    if (locations.length !== cleanLocations.length) {
                        locations = cleanLocations;
                        mapInitialized = false; 
                    } else {
                        locations = cleanLocations;
                    }
                    excelRow1 = cleanStatus;

                    if (!mapInitialized) {
                        initializeMap();
                        mapInitialized = true;
                    }
                    processExcelData(excelRow1);
                } catch (parseError) {
                    console.error("Parse Error");
                }
            } catch (error) {
                console.error("Network error");
            } finally {
                setTimeout(fetchLiveData, 5000);
            }
        }

        function initializeMap() {
            const dotsContainer = document.getElementById('dots-container');
            const totalStations = locations.length;
            const spacerPercent = totalStations > 1 ? (100 / (totalStations - 1)) : 100;
            
            dotsContainer.innerHTML = `<div class="overhead-indicator" id="overhead-dot-indicator"><div class="overhead-dot"></div></div>`;
            
            for (let i = 0; i < totalStations; i++) {
                const dotWrapper = document.createElement('div');
                dotWrapper.className = `dot-wrapper station-${i}`;
                dotWrapper.style.left = `${i * spacerPercent}%`;
                dotWrapper.innerHTML = `<div class="track-dot"></div>`;
                dotsContainer.appendChild(dotWrapper);
            }
        }

        function getStopName(index, context = 'default') {
            let baseName = locations[index];
            const totalStations = locations.length;
            
            if (index === totalStations - 1) { 
                if (currentDirection === 'forward') {
                    if (context === 'arrived-current') return "WELCOME HOME";
                    return baseName; 
                } else { 
                    if (context === 'transit-left-from') return "घरून निघत आहे";
                    return "घर"; 
                }
            }
            return baseName;
        }

        function processExcelData(dataArray) {
            const currentIndex = dataArray.indexOf(1);
            const mainUI = document.getElementById('main-ui');
            const statusText = document.getElementById('status-text');
            const stopName = document.getElementById('stop-name');
            const nextStopLabel = document.getElementById('next-stop-label');
            const nextStopValue = document.getElementById('next-stop-value');
            const filledLine = document.getElementById('filled-line');
            const transitLine = document.getElementById('transit-line');
            const overheadDotIndicator = document.getElementById('overhead-dot-indicator');
            const totalStations = locations.length;
            const spacerPercent = totalStations > 1 ? (100 / (totalStations - 1)) : 100;

            if (currentIndex !== -1 && lastKnownIndex !== -1 && currentIndex !== lastKnownIndex) {
                currentDirection = currentIndex > lastKnownIndex ? 'forward' : 'reverse';
                localStorage.setItem('myCommuteDirection', currentDirection);
            } else if (currentIndex === -1 && lastKnownIndex === totalStations - 1 && currentDirection === 'forward') {
                currentDirection = 'reverse';
                localStorage.setItem('myCommuteDirection', currentDirection);
            } else if (currentIndex === -1 && lastKnownIndex === 0 && currentDirection === 'reverse') {
                currentDirection = 'forward';
                localStorage.setItem('myCommuteDirection', currentDirection);
            }

            document.getElementById('bottom-left-label').innerText = locations[0] || "";
            document.getElementById('bottom-right-label').innerText = getStopName(totalStations - 1, 'default');

            mainUI.className = 'main-wrapper';
            document.querySelectorAll('.dot-wrapper').forEach(el => el.classList.remove('current', 'visited'));
            filledLine.style.left = 'auto'; filledLine.style.right = 'auto';
            transitLine.style.left = 'auto'; transitLine.style.right = 'auto';

            if (currentIndex !== -1) {
                mainUI.className = 'main-wrapper arrived';
                lastKnownIndex = currentIndex;
                localStorage.setItem('myCommuteLastIndex', lastKnownIndex); 
                currentTransitState = -1; 
                
                overheadDotIndicator.style.display = 'flex';
                transitLine.style.opacity = '0';
                
                let nextIndex = currentDirection === 'forward' ? currentIndex + 1 : currentIndex - 1;

                statusText.innerText = "सध्याचे ठिकाण:";
                stopName.innerText = getStopName(currentIndex, 'arrived-current');
                
                if ((currentIndex === totalStations - 1 && currentDirection === 'forward') || 
                    (currentIndex === 0 && currentDirection === 'reverse')) {
                    nextStopLabel.innerText = "प्रवास पूर्ण:";
                    nextStopValue.innerText = "--";
                } else {
                    nextStopLabel.innerText = "पुढील स्टॉप:";
                    nextStopValue.innerText = getStopName(nextIndex, 'default');
                }

                if (currentDirection === 'forward') {
                    for (let i = 0; i < currentIndex; i++) document.querySelector(`.station-${i}`).classList.add('visited');
                    filledLine.style.left = '0%';
                    filledLine.style.width = `${currentIndex * spacerPercent}%`;
                } else {
                    for (let i = totalStations - 1; i > currentIndex; i--) document.querySelector(`.station-${i}`).classList.add('visited');
                    filledLine.style.right = '0%';
                    filledLine.style.width = `${100 - (currentIndex * spacerPercent)}%`;
                }

                document.querySelector(`.station-${currentIndex}`).classList.add('current');
                overheadDotIndicator.style.left = `${currentIndex * spacerPercent}%`;
                overheadDotIndicator.style.opacity = '1';

            } else {
                if (lastKnownIndex >= 0) {
                    mainUI.className = 'main-wrapper transit';
                    overheadDotIndicator.style.display = 'flex';
                    
                    let targetIndex = currentDirection === 'forward' ? lastKnownIndex + 1 : lastKnownIndex - 1;
                    if (targetIndex >= totalStations) targetIndex = totalStations - 1;
                    if (targetIndex < 0) targetIndex = 0;

                    statusText.innerText = "पुढील स्टॉप:";
                    stopName.innerText = getStopName(targetIndex, 'default');
                    nextStopLabel.innerText = "निघाले:";
                    nextStopValue.innerText = getStopName(lastKnownIndex, 'transit-left-from');

                    if (currentDirection === 'forward') {
                        for (let i = 0; i <= lastKnownIndex; i++) document.querySelector(`.station-${i}`).classList.add('visited');
                        filledLine.style.left = '0%';
                        filledLine.style.width = `${lastKnownIndex * spacerPercent}%`;
                        transitLine.style.left = `${lastKnownIndex * spacerPercent}%`;
                        transitLine.style.borderRadius = '0 6px 6px 0';
                    } else {
                        for (let i = totalStations - 1; i >= lastKnownIndex; i--) document.querySelector(`.station-${i}`).classList.add('visited');
                        filledLine.style.right = '0%';
                        filledLine.style.width = `${100 - (lastKnownIndex * spacerPercent)}%`;
                        transitLine.style.right = `${100 - (lastKnownIndex * spacerPercent)}%`;
                        transitLine.style.borderRadius = '6px 0 0 6px';
                    }

                    transitLine.style.opacity = '1';
                    
                    if (currentTransitState !== lastKnownIndex) {
                        currentTransitState = lastKnownIndex;
                        transitLine.style.transition = 'none'; 
                        transitLine.style.width = '0%';
                        
                        setTimeout(() => {
                            transitLine.style.transition = 'width 120s cubic-bezier(0.1, 0.9, 0.2, 1)';
                            transitLine.style.width = `${spacerPercent * 0.95}%`; 
                        }, 50);
                    }

                    overheadDotIndicator.style.left = `${targetIndex * spacerPercent}%`;
                    overheadDotIndicator.style.opacity = '1';

                } else {
                   mainUI.className = 'main-wrapper waiting';
                   statusText.innerText = "प्रवासाची प्रतीक्षा:";
                   stopName.innerText = getStopName(0, 'default');
                   nextStopLabel.innerText = "पुढील स्टॉप:";
                   nextStopValue.innerText = getStopName(1, 'default');
                   overheadDotIndicator.style.display = 'none';
                   transitLine.style.opacity = '0';
                }
            }
        }

        fetchLiveData();
    </script>
</body>
</html>
