<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Desk Clock</title>
    <style>
        /* Reset margins and prevent scrolling */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000000; /* Pitch black background */
            color: #ffffff; /* Crisp white text */
            font-family: 'Arial Black', Impact, 'Segoe UI Black', system-ui, sans-serif; 
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Top Center Date Styling */
        #date-display {
            position: absolute;
            top: 5vh;
            left: 0;
            width: 100%;
            text-align: center; /* Centers the date */
            font-size: 7vw; /* Increased size */
            font-weight: bold;
            color: #ffffff; /* Changed to pure white */
            font-family: system-ui, -apple-system, sans-serif;
            letter-spacing: 1px;
        }

        /* Massive Center Time Styling */
        #time-display {
            font-size: 35vw; 
            font-weight: 900;
            line-height: 1;
            display: flex;
            align-items: center;
            letter-spacing: -2px; 
        }

        /* Blinking Colon Animation */
        #colon {
            animation: blink 1s infinite;
            position: relative;
            top: -2vw; 
            margin: 0 1vw;
        }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        /* Adjustments for Landscape Mode */
        @media (orientation: landscape) {
            #date-display { 
                font-size: 4.5vw; /* Made significantly larger for landscape */
                top: 8vh;
            }
            #time-display { 
                font-size: 28vw; 
            }
        }
    </style>
</head>
<body>

    <!-- Centered Date at the top -->
    <div id="date-display"></div>

    <!-- Huge time in the center -->
    <div id="time-display">
        <span id="hours"></span><span id="colon">:</span><span id="minutes"></span>
    </div>

    <script>
        function updateClock() {
            const now = new Date();

            // Format Hours and Minutes with leading zeros
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');

            // Inject time into HTML
            document.getElementById('hours').textContent = hours;
            document.getElementById('minutes').textContent = minutes;

            // Format Date
            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const dayName = days[now.getDay()];
            const day = String(now.getDate()).padStart(2, '0');
            const month = String(now.getMonth() + 1).padStart(2, '0'); 
            const year = now.getFullYear();

            // Inject date into HTML
            document.getElementById('date-display').textContent = `${day}/${month}/${year} | ${dayName}`;
        }

        // Run immediately
        updateClock();
        
        // Update the clock every 1000 milliseconds
        setInterval(updateClock, 1000);
    </script>

</body>
</html>
