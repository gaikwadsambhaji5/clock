<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Desk Clock Pro</title>

<!-- iOS Fullscreen / Web App Support -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Desk Clock">
<meta name="mobile-web-app-capable" content="yes">

<style>
/* ==========================================================================
   1. RESET & VARIABLES
   ========================================================================== */
:root {
  --bg-color: #070708;
  --text-main: #FFFFFF;
  --text-muted: #8E8E93;
  --text-dim: #48484A;
  --border-color: #1C1C1E;
  --accent: #0A84FF;
  --font-stack: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  background-color: var(--bg-color);
  color: var(--text-main);
  overflow: hidden;
  font-family: var(--font-stack);
  -webkit-font-smoothing: antialiased;
}

body.hide-cursor {
  cursor: none;
}

/* ==========================================================================
   2. MAIN LAYOUT GRID
   ========================================================================== */
.app-viewport {
  display: grid;
  grid-template-rows: auto 1fr auto;
  width: 100vw;
  height: 100vh;
  padding: 3vh 3vw;
  transition: transform 2.5s cubic-bezier(0.4, 0, 0.2, 1);
}

/* TOP BAR: DATE & DAY */
.header-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 5;
}

#date-day {
  font-size: clamp(0.9rem, 1.8vw, 1.6rem);
  font-weight: 600;
  color: var(--text-muted);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  user-select: none;
}

/* CENTER: MASSIVE CLOCK */
.clock-stage {
  display: flex;
  justify-content: center;
  align-items: center;
  width: 100%;
  height: 100%;
}

.time-wrapper {
  position: relative;
  display: flex;
  align-items: baseline;
  justify-content: center;
  width: 100%;
}

#time {
  font-weight: 800;
  line-height: 0.85;
  letter-spacing: -0.05em;
  font-variant-numeric: tabular-nums;
  user-select: none;
  white-space: nowrap;
  text-align: center;
}

/* SMALL AM/PM & SECONDS MODULE */
.sub-indicators {
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  margin-left: 1.5vw;
  padding-bottom: 0.5vw;
}

#ampm {
  font-size: clamp(1rem, 3.5vw, 4rem);
  font-weight: 700;
  color: var(--text-muted);
  line-height: 1;
  margin-bottom: 0.5vh;
  user-select: none;
}

#seconds {
  font-size: clamp(1.2rem, 4vw, 4.5rem);
  font-weight: 600;
  color: var(--text-main);
  font-variant-numeric: tabular-nums;
  line-height: 1;
  background: var(--border-color);
  padding: 0.2em 0.35em;
  border-radius: 6px;
  user-select: none;
}

/* ==========================================================================
   3. CONTROLS & MODAL
   ========================================================================== */
.controls {
  position: absolute;
  top: 3vh;
  right: 3vw;
  display: flex;
  gap: 12px;
  z-index: 10;
}

:fullscreen .controls,
:-webkit-full-screen .controls {
  display: none !important;
}

.icon-btn {
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.25rem;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 50%;
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.2s ease;
  user-select: none;
}

.icon-btn:hover {
  background: rgba(255, 255, 255, 0.12);
  color: var(--text-main);
  transform: scale(1.05);
}

.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.75);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 50;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
}

.modal-overlay.active {
  opacity: 1;
  pointer-events: all;
}

.modal {
  background: #151516;
  border: 1px solid var(--border-color);
  padding: 28px;
  border-radius: 16px;
  width: 90%;
  max-width: 360px;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
}

.modal h2 {
  font-size: 1.25rem;
  font-weight: 600;
  margin-bottom: 24px;
  color: var(--text-main);
  letter-spacing: -0.01em;
}

.setting-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
  font-size: 0.95rem;
  color: #D1D1D6;
}

.setting-row input[type="checkbox"] {
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--accent);
}

.close-btn {
  width: 100%;
  padding: 14px;
  background: var(--text-main);
  color: #000;
  border: none;
  border-radius: 10px;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  margin-top: 12px;
  transition: opacity 0.2s;
}

.close-btn:hover {
  opacity: 0.85;
}
</style>
</head>
<body>

  <!-- Controls -->
  <div class="controls">
    <button class="icon-btn" id="fullscreen-btn" title="Fullscreen">⛶</button>
    <button class="icon-btn" id="settings-btn" title="Settings">⚙</button>
  </div>

  <!-- Settings Modal -->
  <div class="modal-overlay" id="settings-modal">
    <div class="modal">
      <h2>Clock Preferences</h2>
      
      <div class="setting-row">
        <label for="toggle-12hr">12-Hour Time (AM/PM)</label>
        <input type="checkbox" id="toggle-12hr">
      </div>
      
      <div class="setting-row">
        <label for="toggle-seconds">Show Seconds</label>
        <input type="checkbox" id="toggle-seconds" checked>
      </div>

      <div class="setting-row">
        <label for="toggle-oled">OLED Burn-in Protection</label>
        <input type="checkbox" id="toggle-oled" checked>
      </div>

      <button class="close-btn" id="close-settings">Done</button>
    </div>
  </div>

  <!-- Main Viewport -->
  <div class="app-viewport" id="viewport">
    
    <header class="header-bar">
      <div id="date-day"></div>
    </header>

    <main class="clock-stage">
      <div class="time-wrapper">
        <div id="time">00:00</div>
        <div class="sub-indicators">
          <div id="ampm"></div>
          <div id="seconds">00</div>
        </div>
      </div>
    </main>

    <!-- Empty footer row to keep vertical grid centered -->
    <footer></footer>

  </div>

<script>
/* ==========================================================================
   1. STATE & SETTINGS
   ========================================================================== */
const settingsBtn = document.getElementById("settings-btn");
const settingsModal = document.getElementById("settings-modal");
const closeSettingsBtn = document.getElementById("close-settings");

const toggle12Hr = document.getElementById("toggle-12hr");
const toggleSeconds = document.getElementById("toggle-seconds");
const toggleOled = document.getElementById("toggle-oled");

let settings = {
  is12Hour: localStorage.getItem("is12Hour") === "true",
  showSeconds: localStorage.getItem("showSeconds") !== "false",
  oledProtection: localStorage.getItem("oledProtection") !== "false"
};

toggle12Hr.checked = settings.is12Hour;
toggleSeconds.checked = settings.showSeconds;
toggleOled.checked = settings.oledProtection;

settingsBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  settingsModal.classList.add("active");
});

closeSettingsBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  settings.is12Hour = toggle12Hr.checked;
  settings.showSeconds = toggleSeconds.checked;
  settings.oledProtection = toggleOled.checked;

  localStorage.setItem("is12Hour", settings.is12Hour);
  localStorage.setItem("showSeconds", settings.showSeconds);
  localStorage.setItem("oledProtection", settings.oledProtection);

  settingsModal.classList.remove("active");
  updateClock();
});

/* ==========================================================================
   2. DYNAMIC FONT SCALING (Pro Edge-to-Edge Algorithm)
   ========================================================================== */
function scaleFontSize() {
  const timeEl = document.getElementById("time");
  const charCount = timeEl.innerText.length || 5;
  
  // Calculate optimal font size dynamically based on viewport width/height
  const vwSize = 88 / (charCount * 0.44);
  const vhSize = 62; 
  
  timeEl.style.fontSize = `${Math.min(vwSize, vhSize)}vw`;
}

/* ==========================================================================
   3. CLOCK CORE
   ========================================================================== */
const days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

function updateClock() {
  const now = new Date();
  let hNum = now.getHours();
  let ampmStr = "";

  if (settings.is12Hour) {
    ampmStr = hNum >= 12 ? "PM" : "AM";
    hNum = hNum % 12 || 12;
  }

  const h = String(hNum).padStart(2, "0");
  const m = String(now.getMinutes()).padStart(2, "0");
  const s = String(now.getSeconds()).padStart(2, "0");

  document.getElementById("time").textContent = `${h}:${m}`;

  const ampmEl = document.getElementById("ampm");
  if (ampmStr) {
    ampmEl.style.display = "block";
    ampmEl.textContent = ampmStr;
  } else {
    ampmEl.style.display = "none";
  }

  const secondsEl = document.getElementById("seconds");
  if (settings.showSeconds) {
    secondsEl.style.display = "block";
    secondsEl.textContent = s;
  } else {
    secondsEl.style.display = "none";
  }

  document.getElementById("date-day").textContent = 
    `${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()} — ${days[now.getDay()]}`;

  scaleFontSize();
}

window.addEventListener("resize", scaleFontSize);
updateClock();
setInterval(updateClock, 1000);

/* ==========================================================================
   4. FULLSCREEN & APPLE HOME SCREEN SUPPORT
   ========================================================================== */
const isIPhone = /iPhone/i.test(navigator.userAgent);

function goFullscreen() {
  if (isIPhone && !window.navigator.standalone) {
    alert("To use Fullscreen on iPhone:\n\n1. Tap the Share button (square with arrow) at the bottom of Safari.\n2. Select 'Add to Home Screen'.\n3. Open the Clock from your Home Screen!");
    return;
  }

  if (!document.fullscreenElement) {
    const docElm = document.documentElement;
    if (docElm.requestFullscreen) {
      docElm.requestFullscreen().catch(() => {});
    } else if (docElm.webkitRequestFullscreen) {
      docElm.webkitRequestFullscreen();
    }
  }
}

document.getElementById("fullscreen-btn").addEventListener("click", (e) => {
  e.stopPropagation();
  goFullscreen();
});

if (!isIPhone) {
  setTimeout(goFullscreen, 5000);
}

/* ==========================================================================
   5. OLED PIXEL SHIFTING & INACTIVITY CURSOR
   ========================================================================== */
setInterval(() => {
  if (settings.oledProtection) {
    const x = Math.floor(Math.random() * 15) - 7;
    const y = Math.floor(Math.random() * 15) - 7;
    document.getElementById("viewport").style.transform = `translate(${x}px, ${y}px)`;
  } else {
    document.getElementById("viewport").style.transform = "translate(0px, 0px)";
  }
}, 60000);

let cursorTimer;
document.addEventListener("mousemove", () => {
  document.body.classList.remove("hide-cursor");
  clearTimeout(cursorTimer);
  cursorTimer = setTimeout(() => {
    if (!settingsModal.classList.contains("active")) {
      document.body.classList.add("hide-cursor");
    }
  }, 3000);
});

/* ==========================================================================
   6. KEEP AWAKE LOCK
   ========================================================================== */
let wakeLock = null;
async function keepAwake() {
  try {
    if ("wakeLock" in navigator) {
      wakeLock = await navigator.wakeLock.request("screen");
    }
  } catch (e) {}
}
keepAwake();
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") keepAwake();
});

/* ==========================================================================
   7. BACKGROUND GITHUB UPDATE CHECKER
   ========================================================================== */
const FILE_URL = "https://gaikwadsambhaji5.github.io/clock/index.html";
let lastContentHash = "";

function hashCode(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    const char = str.charCodeAt(i);
    hash = (hash << 5) - hash + char;
    hash |= 0;
  }
  return hash.toString();
}

async function checkUpdate() {
  try {
    const fetchUrl = FILE_URL + "?t=" + new Date().getTime();
    const response = await fetch(fetchUrl, { method: "GET", cache: "no-store" });
    if (!response.ok) return;

    const text = await response.text();
    const currentHash = hashCode(text);

    if (!lastContentHash) {
      lastContentHash = currentHash;
    } else if (currentHash !== lastContentHash) {
      window.location.href = window.location.pathname + "?updated=" + new Date().getTime();
    }
  } catch (e) {}
}

checkUpdate();
setInterval(checkUpdate, 5000);
</script>

</body>
</html>
