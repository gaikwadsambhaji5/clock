<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Desk Clock</title>

<!-- iOS Fullscreen / Web App Support -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Desk Clock">
<meta name="mobile-web-app-capable" content="yes">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
background:#000;
color:#fff;
overflow:hidden;
font-family:"Arial Black", Impact, system-ui, -apple-system, sans-serif;
}

body{
display:flex;
justify-content:center;
align-items:center;
}

body.hide-cursor{
cursor:none;
}

/* =====================
   TOP-LEFT DATE & DAY
   ===================== */
#date-day{
position:absolute;
top:20px;
left:20px;
font-size:1.5rem;
font-weight:700;
color:#aaa;
letter-spacing:0.05em;
user-select:none;
z-index:10;
font-family:Arial, sans-serif;
}

/* =====================
   CLOCK LAYOUT
   ===================== */
.container{
text-align:center;
width:96vw;
max-height:96vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
transition:transform 3s ease-in-out;
}

.clock-wrapper{
position:relative;
display:inline-block;
width:100%;
}

#time{
font-weight:900;
line-height:0.85;
letter-spacing:-0.04em;
font-variant-numeric:tabular-nums;
user-select:none;
white-space:nowrap;
width:100%;
text-align:center;
}

#seconds{
position:absolute;
bottom:0;
right:0;
font-size:4vw;
font-weight:700;
color:#888;
font-variant-numeric:tabular-nums;
user-select:none;
transform:translateY(80%); /* Sits neatly just below the bottom right of HH:MM */
}

/* =====================
   BUTTON CONTROLS
   ===================== */
.controls{
position:absolute;
top:20px;
right:20px;
display:flex;
gap:15px;
z-index:10;
}

/* Hide buttons automatically when in fullscreen mode */
:fullscreen .controls,
:-webkit-full-screen .controls {
display:none !important;
}

.icon-btn{
font-size:2rem;
background:none;
border:none;
color:#444;
cursor:pointer;
transition:color 0.3s, transform 0.3s;
user-select:none;
}

.icon-btn:hover{
color:#fff;
transform:scale(1.15);
}

#settings-btn:hover{
transform:rotate(45deg);
}

/* =====================
   SETTINGS MODAL
   ===================== */
.modal-overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.85);
display:flex;
justify-content:center;
align-items:center;
z-index:20;
opacity:0;
pointer-events:none;
transition:opacity 0.3s ease;
}

.modal-overlay.active{
opacity:1;
pointer-events:all;
}

.modal{
background:#111;
border:1px solid #333;
padding:30px;
border-radius:12px;
width:90%;
max-width:350px;
text-align:left;
font-family:Arial, sans-serif;
}

.modal h2{
margin-bottom:20px;
font-size:1.5rem;
border-bottom:1px solid #222;
padding-bottom:10px;
color:#ddd;
}

.setting-row{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
font-size:1.1rem;
color:#bbb;
}

.setting-row input[type="checkbox"]{
width:20px;
height:20px;
cursor:pointer;
accent-color:#fff;
}

.close-btn{
width:100%;
padding:12px;
background:#222;
color:#fff;
border:1px solid #444;
border-radius:6px;
font-size:1rem;
cursor:pointer;
transition:background 0.2s;
margin-top:10px;
}

.close-btn:hover{
background:#333;
}

</style>

</head>

<body>

<!-- Top Left Date & Day -->
<div id="date-day"></div>

<!-- Top Right Button Controls -->
<div class="controls">
  <button class="icon-btn" id="fullscreen-btn" title="Fullscreen">⛶</button>
  <button class="icon-btn" id="settings-btn" title="Settings">⚙</button>
</div>

<!-- Settings Modal -->
<div class="modal-overlay" id="settings-modal">
  <div class="modal">
    <h2>Clock Settings</h2>
    
    <div class="setting-row">
      <label for="toggle-12hr">12-Hour Time (AM/PM)</label>
      <input type="checkbox" id="toggle-12hr">
    </div>
    
    <div class="setting-row">
      <label for="toggle-seconds">Show Seconds</label>
      <input type="checkbox" id="toggle-seconds" checked>
    </div>

    <div class="setting-row">
      <label for="toggle-oled">OLED Burn-in Protection</label>
      <input type="checkbox" id="toggle-oled" checked>
    </div>

    <button class="close-btn" id="close-settings">Save & Close</button>
  </div>
</div>

<div class="container">
  <div class="clock-wrapper">
    <div id="time"></div>
    <div id="seconds"></div>
  </div>
</div>

<script>

// =====================
// SETTINGS MANAGEMENT
// =====================

const settingsBtn = document.getElementById("settings-btn");
const settingsModal = document.getElementById("settings-modal");
const closeSettingsBtn = document.getElementById("close-settings");

const toggle12Hr = document.getElementById("toggle-12hr");
const toggleSeconds = document.getElementById("toggle-seconds");
const toggleOled = document.getElementById("toggle-oled");

// Load settings from localStorage or defaults
let settings = {
  is12Hour: localStorage.getItem("is12Hour") === "true",
  showSeconds: localStorage.getItem("showSeconds") !== "false",
  oledProtection: localStorage.getItem("oledProtection") !== "false"
};

toggle12Hr.checked = settings.is12Hour;
toggleSeconds.checked = settings.showSeconds;
toggleOled.checked = settings.oledProtection;

settingsBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  settingsModal.classList.add("active");
});

closeSettingsBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  settings.is12Hour = toggle12Hr.checked;
  settings.showSeconds = toggleSeconds.checked;
  settings.oledProtection = toggleOled.checked;

  localStorage.setItem("is12Hour", settings.is12Hour);
  localStorage.setItem("showSeconds", settings.showSeconds);
  localStorage.setItem("oledProtection", settings.oledProtection);

  settingsModal.classList.remove("active");
  updateClock();
});

// =====================
// DYNAMIC FONT SCALING (Bigger Screen Fit)
// =====================

function scaleFontSize() {
  const timeEl = document.getElementById("time");
  const charCount = timeEl.innerText.length || 5;
  
  // High multiplier pushes HH:MM all the way to screen edges
  const widthBasedSize = (98 / (charCount * 0.52));
  const heightBasedSize = 75; // Allows enormous vertical height
  
  const finalSize = Math.min(widthBasedSize, heightBasedSize);
  timeEl.style.fontSize = `${finalSize}vw`;
}

// =====================
// CLOCK
// =====================

const days=[
"Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"
];

const months=[
"January","February","March","April","May","June",
"July","August","September","October","November","December"
];

function updateClock(){
  const now = new Date();
  let hNum = now.getHours();
  let ampm = "";

  if (settings.is12Hour) {
    ampm = hNum >= 12 ? " PM" : " AM";
    hNum = hNum % 12 || 12;
  }

  let h = String(hNum).padStart(2,"0");
  let m = String(now.getMinutes()).padStart(2,"0");
  let s = String(now.getSeconds()).padStart(2,"0");

  let ampmHTML = ampm ? `<span style="font-size:0.3em; margin-left:0.1em; vertical-align:top;">${ampm}</span>` : "";

  // Big HH:MM
  document.getElementById("time").innerHTML = `${h}:${m}${ampmHTML}`;

  // Small bottom-right seconds
  const secondsEl = document.getElementById("seconds");
  if (settings.showSeconds) {
    secondsEl.style.display = "block";
    secondsEl.textContent = `:${s}`;
  } else {
    secondsEl.style.display = "none";
  }

  // Top left date & day format: "30 July 2030 | Friday"
  document.getElementById("date-day").textContent =
    `${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()} | ${days[now.getDay()]}`;

  scaleFontSize();
}

window.addEventListener("resize", scaleFontSize);

updateClock();
setInterval(updateClock, 1000);

// =====================
// KEEP SCREEN AWAKE
// =====================

let wakeLock=null;

async function keepAwake(){
  try{
    if("wakeLock" in navigator){
      wakeLock = await navigator.wakeLock.request("screen");
    }
  }catch(e){}
}

keepAwake();

document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible") keepAwake();
});

// =====================
// FULLSCREEN CONTROLS (with iPhone support)
// =====================

const isIPhone = /iPhone/i.test(navigator.userAgent);

function goFullscreen() {
  if (isIPhone && !window.navigator.standalone) {
    alert("To use Fullscreen on iPhone:\n\n1. Tap the Share button (square with arrow) at the bottom of Safari.\n2. Select 'Add to Home Screen'.\n3. Open the Clock from your Home Screen!");
    return;
  }

  if(!document.fullscreenElement) {
    const docElm = document.documentElement;
    if (docElm.requestFullscreen) {
      docElm.requestFullscreen().catch(()=>{});
    } else if (docElm.webkitRequestFullscreen) {
      docElm.webkitRequestFullscreen();
    }
  }
}

document.getElementById("fullscreen-btn").addEventListener("click", (e) => {
  e.stopPropagation();
  goFullscreen();
});

if (!isIPhone) {
  setTimeout(goFullscreen, 5000);
}

// =====================
// HIDE CURSOR AFTER INACTIVITY
// =====================

let cursorTimer;
document.addEventListener("mousemove", () => {
  document.body.classList.remove("hide-cursor");
  clearTimeout(cursorTimer);
  cursorTimer = setTimeout(() => {
    if(!settingsModal.classList.contains("active")) {
      document.body.classList.add("hide-cursor");
    }
  }, 3000);
});

// =====================
// OLED BURN-IN PROTECTION (Pixel Shift)
// =====================

setInterval(() => {
  if (settings.oledProtection) {
    const x = Math.floor(Math.random() * 21) - 10;
    const y = Math.floor(Math.random() * 21) - 10;
    document.querySelector(".container").style.transform = `translate(${x}px, ${y}px)`;
  } else {
    document.querySelector(".container").style.transform = "translate(0px, 0px)";
  }
}, 60000);

// =====================
// BACKGROUND UPDATE CHECKER (Checks every 5s, only reloads on change)
// =====================

const FILE_URL = "https://gaikwadsambhaji5.github.io/clock/index.html";
let lastContentHash = "";

function hashCode(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    const char = str.charCodeAt(i);
    hash = (hash << 5) - hash + char;
    hash |= 0;
  }
  return hash.toString();
}

async function checkUpdate(){
  try{
    const fetchUrl = FILE_URL + "?t=" + new Date().getTime();
    const response = await fetch(fetchUrl, {
      method: "GET",
      cache: "no-store"
    });

    if (!response.ok) return;

    const text = await response.text();
    const currentHash = hashCode(text);

    if(!lastContentHash){
      lastContentHash = currentHash;
    }else if(currentHash !== lastContentHash){
      // Automatically refreshes ONLY when new code is detected on GitHub
      window.location.href = window.location.pathname + "?updated=" + new Date().getTime();
    }
  }catch(e){}
}

checkUpdate();
setInterval(checkUpdate, 5000);

</script>

</body>
</html>
