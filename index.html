<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Teko Bold Scrolling Clock</title>
    <style>
        /* Load the local Teko-Bold font */
        @font-face {
            font-family: 'Teko';
            src: url('Teko-Bold.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
        }

        /* Base Reset & Centering */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Teko', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Main Wrapper to contain Header and Clock */
        .clock-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Top Header Container (Day | Month | Date) */
        .date-header {
            font-size: 45px; 
            display: flex;
            gap: 12px;
            align-items: baseline;
            letter-spacing: 1px;
            line-height: 1;
            margin-bottom: 2px;
        }

        .pipe {
            font-size: 40px;
            transform: translateY(-2px);
        }

        /* Horizontal Divider Line */
        .divider {
            width: 100%;
            height: 4px;
            background-color: #ffffff;
            margin-bottom: 0px; /* Reduced to bring digits closer to line */
        }

        /* Clock Container */
        .time-container {
            display: flex;
            align-items: center;
            gap: 2px; /* Pulls the hours and minutes blocks tighter together */
            /* Adjusted the 'below' offset to pull the reflection up tighter to the text */
            -webkit-box-reflect: below -45px linear-gradient(to bottom, transparent 35%, rgba(255, 255, 255, 0.7) 100%);
        }

        /* The Window that clips exactly one digit */
        .digit-window {
            height: 280px;
            overflow: hidden;
            position: relative;
        }

        /* The strip of numbers that slides up and down */
        .digit-strip {
            display: flex;
            flex-direction: column;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: transform;
        }

        /* Individual Digit Styling - Made much larger and closer */
        .digit {
            height: 280px;
            line-height: 280px;
            font-size: 380px; /* Massively increased size */
            text-align: center;
            width: 125px; /* Narrowed width to push numbers together */
        }

        /* Blinking Vertical Line */
        .separator {
            font-size: 220px;
            line-height: 280px;
            font-weight: normal;
            margin: 0 5px; /* Slight breathing room around the line */
            transform: translateY(-10px); /* Optically centers the pipe */
            animation: blink 1s step-end infinite; /* step-end gives it a sharp ON/OFF blink */
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="clock-wrapper">
        <!-- Date Header -->
        <div class="date-header">
            <span id="day-marathi">सोमवार</span> 
            <span class="pipe">|</span> 
            <span id="month-marathi">ऑगस्ट</span> 
            <span class="pipe">|</span> 
            <span id="date-num">10/08/2026</span>
        </div>

        <!-- Horizontal Line -->
        <div class="divider"></div>

        <!-- Scrolling Clock -->
        <div class="time-container" id="clock">
            <!-- Hours -->
            <div class="digit-window"><div class="digit-strip" id="h-tens"></div></div>
            <div class="digit-window"><div class="digit-strip" id="h-units"></div></div>
            
            <!-- Blinking Vertical Line -->
            <div class="separator">|</div>

            <!-- Minutes -->
            <div class="digit-window"><div class="digit-strip" id="m-tens"></div></div>
            <div class="digit-window"><div class="digit-strip" id="m-units"></div></div>
        </div>
    </div>

    <script>
        // Configuration
        const DIGIT_HEIGHT = 280; // Updated to match the new 280px height of .digit

        // Marathi Localization Arrays
        const marathiDays = ["रविवार", "सोमवार", "मंगळवार", "बुधवार", "गुरुवार", "शुक्रवार", "शनिवार"];
        const marathiMonths = ["जानेवारी", "फेब्रुवारी", "मार्च", "एप्रिल", "मे", "जून", "जुलै", "ऑगस्ट", "सप्टेंबर", "ऑक्टोबर", "नोव्हेंबर", "डिसेंबर"];

        // Function to build HTML for the number strips
        function buildStrip(id, maxNumber) {
            const strip = document.getElementById(id);
            let html = '';
            for (let i = 0; i <= maxNumber; i++) {
                html += `<div class="digit">${i}</div>`;
            }
            strip.innerHTML = html;
        }

        // Build the strips (24-hour format: 23:59 max)
        buildStrip('h-tens', 2);
        buildStrip('h-units', 9);
        buildStrip('m-tens', 5);
        buildStrip('m-units', 9);

        // Function to move the strip to the correct number
        function updateStrip(id, value) {
            const strip = document.getElementById(id);
            const translateY = -(value * DIGIT_HEIGHT);
            strip.style.transform = `translate3d(0, ${translateY}px, 0)`;
        }

        // Function to update the date header in Marathi
        function updateDateHeader(now) {
            const day = marathiDays[now.getDay()];
            const month = marathiMonths[now.getMonth()];
            
            const dd = String(now.getDate()).padStart(2, '0');
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const yyyy = now.getFullYear();
            const dateString = `${dd}/${mm}/${yyyy}`;

            document.getElementById('day-marathi').textContent = day;
            document.getElementById('month-marathi').textContent = month;
            document.getElementById('date-num').textContent = dateString;
        }

        // Main clock loop
        function updateClock() {
            const now = new Date();
            
            // Format time into 2-digit strings (HH:MM)
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');

            // Apply scroll translations
            updateStrip('h-tens', parseInt(hours[0]));
            updateStrip('h-units', parseInt(hours[1]));
            updateStrip('m-tens', parseInt(minutes[0]));
            updateStrip('m-units', parseInt(minutes[1]));

            // Update Date
            updateDateHeader(now);

            requestAnimationFrame(updateClock);
        }

        // Initialize clock
        updateClock();
    </script>
</body>
</html>
