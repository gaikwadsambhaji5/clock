<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Desk Clock</title>
    <style>
        /* Reset margins and prevent scrolling */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Arial Black', Impact, 'Segoe UI Black', system-ui, sans-serif; 
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        #date-display {
            position: absolute;
            top: 6vh;
            left: 0;
            width: 100%;
            text-align: center; 
            font-size: 11vw; 
            font-weight: bold;
            color: #ffffff; 
            font-family: system-ui, -apple-system, sans-serif;
            letter-spacing: 1px;
        }

        #time-display {
            font-size: 42vw; 
            font-weight: 900;
            line-height: 1;
            display: flex;
            align-items: center;
            letter-spacing: -2px; 
            margin-top: 15vh; 
        }

        #colon {
            animation: blink 1s infinite;
            position: relative;
            top: -2.5vw; 
            margin: 0 1vw;
        }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        #fs-btn {
            position: absolute;
            bottom: 5vh;
            padding: 12px 24px;
            background-color: #222222;
            color: #aaaaaa;
            border: 2px solid #333333;
            border-radius: 30px;
            font-size: 4vw;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            z-index: 10;
            transition: 0.3s ease;
        }

        #fs-btn:active {
            background-color: #444444;
            color: #ffffff;
        }

        #tracker-frame {
            display: none; 
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            border: none;
            z-index: 100; 
            background-color: #000000;
        }

        @media (orientation: landscape) {
            #date-display { 
                font-size: 7vw; 
                top: 8vh;
            }
            #time-display { 
                font-size: 32vw; 
                margin-top: 10vh; 
            }
            #fs-btn {
                font-size: 2vw;
                bottom: 8vh;
                padding: 10px 20px;
            }
        }
    </style>
</head>
<body>

    <iframe id="tracker-frame" src="traker.html"></iframe>
    <div id="date-display"></div>
    <div id="time-display">
        <span id="hours"></span><span id="colon">:</span><span id="minutes"></span>
    </div>
    <button id="fs-btn">Go Full Screen</button>

    <script>
        // --- CLOCK LOGIC ---
        function updateClock() {
            const now = new Date();
            let rawHours = now.getHours();
            rawHours = rawHours % 12;
            rawHours = rawHours ? rawHours : 12; 

            const hours = String(rawHours).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');

            document.getElementById('hours').textContent = hours;
            document.getElementById('minutes').textContent = minutes;

            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const dayName = days[now.getDay()];
            const day = String(now.getDate()).padStart(2, '0');
            const month = String(now.getMonth() + 1).padStart(2, '0'); 
            const year = now.getFullYear();

            document.getElementById('date-display').textContent = `${day}/${month}/${year} | ${dayName}`;
        }

        updateClock();
        setInterval(updateClock, 1000);

        // --- FULLSCREEN LOGIC ---
        const fsBtn = document.getElementById('fs-btn');

        fsBtn.addEventListener('click', () => {
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen();
            } else if (document.documentElement.webkitRequestFullscreen) {
                document.documentElement.webkitRequestFullscreen();
            }
        });

        document.addEventListener('fullscreenchange', handleFullscreenChange);
        document.addEventListener('webkitfullscreenchange', handleFullscreenChange);

        function handleFullscreenChange() {
            if (document.fullscreenElement || document.webkitFullscreenElement) {
                fsBtn.style.display = 'none';
            } else {
                fsBtn.style.display = 'block';
            }
        }

        // --- GOOGLE SHEETS TRACKER LOGIC ---
        const SHEET_URL = 'https://script.google.com/macros/s/AKfycbzPai0H1EKC7vjoPrDUxBIGoeZh5okjpruynywCP27JS6J2Kt_e66XIeer70TKlvwNbzA/exec';
        
        const trackerFrame = document.getElementById('tracker-frame');
        let hideTrackerTimeout;

        function hideTracker() {
            trackerFrame.style.display = 'none';
            localStorage.setItem('trackerState', 'none');
            localStorage.removeItem('trackerHideTime');
        }

        // 1. REFRESH PROTECTION (Runs immediately when the page opens)
        const savedState = localStorage.getItem('trackerState');
        const hideTime = localStorage.getItem('trackerHideTime');

        if (savedState === 'block') {
            if (hideTime) {
                const timeLeft = parseInt(hideTime, 10) - Date.now();
                if (timeLeft > 0) {
                    trackerFrame.style.display = 'block';
                    hideTrackerTimeout = setTimeout(hideTracker, timeLeft);
                } else {
                    hideTracker(); // Timer expired while page was closed/refreshed
                }
            } else {
                trackerFrame.style.display = 'block'; // Traveling mode
            }
        }

        // 2. LIVE TRACKING LOGIC
        let lastState = null; // Will track if we are "traveling" or at a "destination"

        async function checkSpreadsheet() {
            try {
                const response = await fetch(SHEET_URL);
                const data = await response.json();
                
                const currentA1 = String(data.a1).trim();
                const currentG1 = String(data.g1).trim(); // Changed to check G1

                // If ANY cell is 1, you are at a destination (Home or Office). 
                // Otherwise (both 0), you are traveling.
                let currentState = "traveling";
                if (currentA1 === "1" || currentG1 === "1") {
                    currentState = "destination";
                }

                // Run this if the state just changed, OR if this is the very first check after loading the page
                if (currentState !== lastState) {
                    
                    if (currentState === "destination") {
                        // WE ARE AT HOME (G1=1) OR OFFICE (A1=1)
                        if (lastState !== null) {
                            // We JUST arrived right now! Show tracker and start 1-minute timer (60,000 ms).
                            trackerFrame.style.display = 'block';
                            localStorage.setItem('trackerState', 'block');
                            localStorage.setItem('trackerHideTime', Date.now() + 60000); 
                            
                            clearTimeout(hideTrackerTimeout);
                            hideTrackerTimeout = setTimeout(hideTracker, 60000);
                        } else {
                            // The page just loaded and we are already at a destination.
                            // Double-check if the timer has expired. If it has, force the clock to show.
                            const savedTime = localStorage.getItem('trackerHideTime');
                            if (!savedTime || (parseInt(savedTime, 10) - Date.now() <= 0)) {
                                hideTracker();
                            }
                        }
                    } 
                    else if (currentState === "traveling") {
                        // WE ARE TRAVELING (A1=0 AND G1=0)
                        trackerFrame.style.display = 'block';
                        localStorage.setItem('trackerState', 'block');
                        localStorage.removeItem('trackerHideTime'); // Clear timer so tracker stays on forever
                        clearTimeout(hideTrackerTimeout);
                    }
                }

                // Save the current state for the next 3-second check
                lastState = currentState;

            } catch (error) {
                console.log("Could not connect to Google Sheets.");
            }
        }

        // Check the Google Sheet every 3 seconds
        setInterval(checkSpreadsheet, 3000);

    </script>

</body>
</html>
