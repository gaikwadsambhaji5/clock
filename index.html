<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Teko Bold Scrolling Clock - Custom Layout Edition</title>
    <style>
        /* Load the local Teko-Bold font */
        @font-face {
            font-family: 'Teko';
            src: url('Teko-Bold.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
        }

        /* Base Reset & Centering */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Teko', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none; 
            -webkit-user-select: none;
            padding: 0 45px; /* Safe padding for camera notch */
        }

        /* Top Header Container - Restored to Bigger Size */
        .header-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px; /* Slight top padding */
            z-index: 10;
        }

        .date-header {
            font-size: 55px; 
            display: flex;
            gap: 15px;
            align-items: baseline;
            letter-spacing: 1px;
            line-height: 1;
            margin-bottom: 0px;
            font-variant-numeric: tabular-nums; 
        }

        .pipe {
            font-size: 45px;
            transform: translateY(-2px);
        }

        #date-num {
            display: inline-block;
            text-align: center;
        }
        
        #sec-num {
            display: inline-block;
            width: 55px; 
            text-align: left;
        }

        /* Horizontal Divider Line */
        .divider {
            width: 95%; 
            height: 5px;
            background-color: #ffffff;
            margin-bottom: 0px; 
        }

        /* 
         * CLOCK POSITIONER 
         * This wrapper handles all the dragging and stretching transformations
         */
        #clock-positioner {
            display: flex;
            justify-content: center;
            align-items: center;
            /* transform is applied via JS */
            transform-origin: top center;
            cursor: grab;
            margin-top: 25px; /* Base gap below the line */
        }

        #clock-positioner.edit-active {
            border: 2px dashed rgba(0, 255, 170, 0.5);
            background: rgba(0, 255, 170, 0.05);
            border-radius: 20px;
            padding: 10px;
        }

        /* Clock Container - SHADOW COMPLETELY REMOVED */
        .time-container {
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none; /* Let the wrapper handle touch events */
        }

        /* The Window that clips exactly one digit - Restored to Tall size */
        .digit-window {
            height: 380px; 
            width: 180px;  
            overflow: hidden;
            position: relative;
        }
        
        /* Gap between the two numbers */
        .tens-window {
            margin-right: 15px; 
        }

        /* The strip of numbers */
        .digit-strip {
            display: flex;
            flex-direction: column;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: transform;
        }

        /* Individual Digit Styling */
        .digit {
            height: 380px; 
            line-height: 380px;
            font-size: 480px; 
            width: 180px; 
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Blinking Colon Separator */
        .separator {
            font-size: 300px; 
            line-height: 380px;
            font-weight: bold;
            margin: 0 10px; 
            transform: translateY(-35px); 
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* --- MENUS & OVERLAYS --- */

        .settings-overlay {
            display: none; 
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            padding: 40px 30px 30px 30px; 
            border-radius: 20px;
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            font-family: -apple-system, sans-serif;
            min-width: 300px;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: #ffffff;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            opacity: 0.7;
        }

        .settings-btn {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 15px 24px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
        }

        .settings-btn.accent {
            background: #00ffaa;
            color: #000;
        }

        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            gap: 20px;
            font-size: 20px;
            font-weight: bold;
        }

        /* Edit Layout Control Panel */
        .layout-panel {
            display: none;
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 10, 10, 0.95);
            border: 2px solid #00ffaa;
            border-radius: 15px;
            padding: 20px;
            width: 90%;
            max-width: 500px;
            z-index: 2000;
            font-family: -apple-system, sans-serif;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 10px 30px rgba(0,255,170,0.2);
        }

        .layout-panel h3 {
            margin: 0;
            text-align: center;
            color: #00ffaa;
            font-size: 18px;
        }

        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .slider-group label {
            font-weight: bold;
            font-size: 14px;
        }

        input[type=range] {
            width: 100%;
            accent-color: #00ffaa;
        }

        .layout-actions {
            display: flex;
            gap: 10px;
        }
        
        .layout-actions button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        
        .btn-save { background: #00ffaa; color: #000; }
        .btn-reset { background: #555; color: #fff; }

        /* Custom Checkbox Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #555; transition: .4s;
            border-radius: 34px;
        }
        .slider:before {
            position: absolute; content: "";
            height: 26px; width: 26px;
            left: 4px; bottom: 4px;
            background-color: white; transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: #00ffaa; }
        input:checked + .slider:before { transform: translateX(26px); }

    </style>
</head>
<body>

    <!-- Header remains fixed at top -->
    <div class="header-wrapper">
        <div class="date-header">
            <span id="day-marathi">सोमवार</span> 
            <span class="pipe">|</span> 
            <span id="month-marathi">ऑगस्ट</span> 
            <span class="pipe">|</span> 
            <span id="date-num">10/08/2026</span>
            <span class="pipe">|</span> 
            <span id="sec-num">00</span>
        </div>
        <div class="divider"></div>
    </div>

    <!-- Draggable & Stretchable Clock Wrapper -->
    <div id="clock-positioner">
        <div class="time-container" id="clock">
            <!-- Hours -->
            <div class="digit-window tens-window"><div class="digit-strip" id="h-tens"></div></div>
            <div class="digit-window"><div class="digit-strip" id="h-units"></div></div>
            
            <!-- Colon Separator -->
            <div class="separator">:</div>

            <!-- Minutes -->
            <div class="digit-window tens-window"><div class="digit-strip" id="m-tens"></div></div>
            <div class="digit-window"><div class="digit-strip" id="m-units"></div></div>
        </div>
    </div>

    <!-- Hidden Settings Menu -->
    <div class="settings-overlay" id="settings-menu">
        <button class="close-btn" id="close-settings">✕</button>
        <button class="settings-btn" id="fullscreen-btn">Toggle Full Screen</button>
        <button class="settings-btn accent" id="edit-layout-btn">Edit Layout (Drag & Stretch)</button>
        
        <div class="toggle-row">
            <span>12-Hour Format</span>
            <label class="switch">
                <input type="checkbox" id="format-toggle">
                <span class="slider-btn slider"></span>
            </label>
        </div>
    </div>

    <!-- Layout Control Panel -->
    <div class="layout-panel" id="layout-panel">
        <h3>DRAG THE TIME TO MOVE IT</h3>
        
        <div class="slider-group">
            <label>Stretch Width (Sides)</label>
            <input type="range" id="scale-x" min="0.5" max="2" step="0.05" value="1">
        </div>
        
        <div class="slider-group">
            <label>Stretch Height (Top/Bottom)</label>
            <input type="range" id="scale-y" min="0.5" max="2" step="0.05" value="1">
        </div>

        <div class="layout-actions">
            <button class="btn-reset" id="layout-reset">Reset Default</button>
            <button class="btn-save" id="layout-save">Save & Exit</button>
        </div>
    </div>

    <script>
        // --- CLOCK ENGINE ---
        const DIGIT_HEIGHT = 380; 
        let is12Hour = localStorage.getItem('is12Hour') === 'true';

        const marathiDays = ["रविवार", "सोमवार", "मंगळवार", "बुधवार", "गुरुवार", "शुक्रवार", "शनिवार"];
        const marathiMonths = ["जानेवारी", "फेब्रुवारी", "मार्च", "एप्रिल", "मे", "जून", "जुलै", "ऑगस्ट", "सप्टेंबर", "ऑक्टोबर", "नोव्हेंबर", "डिसेंबर"];

        function buildStrip(id, maxNumber) {
            const strip = document.getElementById(id);
            let html = '';
            for (let i = 0; i <= maxNumber; i++) {
                html += `<div class="digit">${i}</div>`;
            }
            strip.innerHTML = html;
        }

        buildStrip('h-tens', 2);
        buildStrip('h-units', 9);
        buildStrip('m-tens', 5);
        buildStrip('m-units', 9);

        function updateStrip(id, value) {
            const strip = document.getElementById(id);
            const translateY = -(value * DIGIT_HEIGHT);
            strip.style.transform = `translate3d(0, ${translateY}px, 0)`;
        }

        function updateDateHeader(now) {
            const day = marathiDays[now.getDay()];
            const month = marathiMonths[now.getMonth()];
            
            const dd = String(now.getDate()).padStart(2, '0');
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const yyyy = now.getFullYear();
            
            const ss = String(now.getSeconds()).padStart(2, '0');

            document.getElementById('day-marathi').textContent = day;
            document.getElementById('month-marathi').textContent = month;
            document.getElementById('date-num').textContent = `${dd}/${mm}/${yyyy}`;
            document.getElementById('sec-num').textContent = ss;
        }

        function updateClock() {
            const now = new Date();
            let rawHours = now.getHours();
            
            if (is12Hour) {
                rawHours = rawHours % 12;
                rawHours = rawHours ? rawHours : 12; 
            }

            const hours = String(rawHours).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');

            updateStrip('h-tens', parseInt(hours[0]));
            updateStrip('h-units', parseInt(hours[1]));
            updateStrip('m-tens', parseInt(minutes[0]));
            updateStrip('m-units', parseInt(minutes[1]));

            updateDateHeader(now);
            requestAnimationFrame(updateClock);
        }

        updateClock();

        // --- LAYOUT DRAG & STRETCH ENGINE ---
        const positioner = document.getElementById('clock-positioner');
        const layoutPanel = document.getElementById('layout-panel');
        const scaleXSlider = document.getElementById('scale-x');
        const scaleYSlider = document.getElementById('scale-y');
        
        let isEditMode = false;
        let pX = 0, pY = 0, sX = 1, sY = 1;

        // Load saved layout
        const savedLayout = JSON.parse(localStorage.getItem('clockLayout'));
        if (savedLayout) {
            pX = savedLayout.x; pY = savedLayout.y;
            sX = savedLayout.sx; sY = savedLayout.sy;
        }
        applyTransform();

        function applyTransform() {
            positioner.style.transform = `translate(${pX}px, ${pY}px) scale(${sX}, ${sY})`;
        }

        // Sliders
        scaleXSlider.addEventListener('input', (e) => { sX = e.target.value; applyTransform(); });
        scaleYSlider.addEventListener('input', (e) => { sY = e.target.value; applyTransform(); });

        // Touch Dragging Logic
        let isDragging = false;
        let startX, startY, initialX, initialY;

        positioner.addEventListener('touchstart', (e) => {
            if (!isEditMode) return;
            isDragging = true;
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
            initialX = pX;
            initialY = pY;
        });

        positioner.addEventListener('touchmove', (e) => {
            if (!isDragging || !isEditMode) return;
            e.preventDefault(); 
            const dx = e.touches[0].clientX - startX;
            const dy = e.touches[0].clientY - startY;
            pX = initialX + dx;
            pY = initialY + dy;
            applyTransform();
        });

        positioner.addEventListener('touchend', () => { isDragging = false; });

        // Enter Edit Mode
        document.getElementById('edit-layout-btn').addEventListener('click', () => {
            hideSettings();
            isEditMode = true;
            layoutPanel.style.display = 'flex';
            positioner.classList.add('edit-active');
            scaleXSlider.value = sX;
            scaleYSlider.value = sY;
        });

        // Save & Exit Edit Mode
        document.getElementById('layout-save').addEventListener('click', () => {
            isEditMode = false;
            layoutPanel.style.display = 'none';
            positioner.classList.remove('edit-active');
            localStorage.setItem('clockLayout', JSON.stringify({x: pX, y: pY, sx: sX, sy: sY}));
        });

        // Reset Layout
        document.getElementById('layout-reset').addEventListener('click', () => {
            pX = 0; pY = 0; sX = 1; sY = 1;
            scaleXSlider.value = 1; scaleYSlider.value = 1;
            applyTransform();
        });

        // --- SETTINGS & SCREEN WAKE LOGIC ---
        const settingsMenu = document.getElementById('settings-menu');
        const formatToggle = document.getElementById('format-toggle');
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        let hideTimeout;
        let wakeLock = null;

        // Initialize Settings
        formatToggle.checked = is12Hour;

        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try { wakeLock = await navigator.wakeLock.request('screen'); } 
                catch (err) { console.error(err); }
            }
        }

        function releaseWakeLock() {
            if (wakeLock !== null) { wakeLock.release().then(() => { wakeLock = null; }); }
        }

        function showSettings() {
            if(isEditMode) return; // Don't show settings if currently editing layout
            settingsMenu.style.display = 'flex';
            resetHideTimer();
        }

        function hideSettings() {
            settingsMenu.style.display = 'none';
            clearTimeout(hideTimeout);
        }

        function resetHideTimer() {
            clearTimeout(hideTimeout);
            hideTimeout = setTimeout(hideSettings, 10000); 
        }

        document.getElementById('close-settings').addEventListener('click', hideSettings);

        // 5-Tap logic
        let tapCount = 0;
        let tapTimer;
        
        function handleTap(e) {
            // Ignore taps on UI elements
            if (e.target.closest('#settings-menu') || e.target.closest('#layout-panel') || isEditMode) return; 
            
            tapCount++;
            clearTimeout(tapTimer);
            
            if (tapCount >= 5) {
                showSettings();
                tapCount = 0;
            } else {
                tapTimer = setTimeout(() => { tapCount = 0; }, 600); 
            }
        }

        document.body.addEventListener('touchend', handleTap);
        document.body.addEventListener('click', handleTap); 

        formatToggle.addEventListener('change', function(e) {
            is12Hour = e.target.checked;
            localStorage.setItem('is12Hour', is12Hour);
            resetHideTimer(); 
        });

        fullscreenBtn.addEventListener('click', function() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().then(() => {
                    requestWakeLock();
                }).catch(err => { console.log(err); });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen().then(() => {
                        releaseWakeLock();
                    });
                }
            }
            hideSettings();
        });

        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                requestWakeLock();
            }
        });
    </script>
</body>
</html>
