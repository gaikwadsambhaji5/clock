<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Scrolling Clock - Rock Solid Edition</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Orbitron:wght@700&family=Oswald:wght@700&family=Rajdhani:wght@700&family=Righteous&family=Rubik+Mono+One&family=Share+Tech+Mono&display=swap');
    </style>

    <style>
        @font-face {
            font-family: 'Teko Local';
            src: url('Teko-Bold.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
        }

        :root {
            --clock-color: #ffffff;
        }

        * {
            box-sizing: border-box; margin: 0; padding: 0;
            -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;
        }

        body {
            background-color: #000000; color: var(--clock-color);
            display: flex; flex-direction: column; align-items: center;
            height: 100vh; overflow: hidden; user-select: none; 
            -webkit-user-select: none; padding: 0 45px; 
            transition: color 1s ease; touch-action: manipulation;
        }

        /* --- HEADER LAYOUT --- */
        #header-positioner {
            width: 100%; display: flex; flex-direction: column; align-items: center;
            margin-top: 20px; transform-origin: top center; z-index: 10; padding: 10px;
            border: 2px solid transparent; cursor: grab; transition: font-family 0.3s ease;
        }

        .date-header {
            width: 86%; display: flex; justify-content: space-between; align-items: baseline;
            letter-spacing: 1px; line-height: 1; margin-bottom: 0px;
            font-variant-numeric: tabular-nums; font-size: clamp(35px, 5.5vw, 55px); white-space: nowrap; 
        }

        .pipe { font-size: 0.8em; transform: translateY(-2px); opacity: 0.8; }
        #date-num { display: inline-block; text-align: center; }
        #sec-wrapper { display: flex; align-items: center; gap: 8px; }
        #sec-num { display: inline-block; width: 1.2em; text-align: right; }

        /* --- NETWORK STATUS DOT --- */
        .network-dot {
            width: 12px; height: 12px; border-radius: 50%; display: inline-block;
            transition: background-color 0.5s ease, box-shadow 0.5s ease;
        }
        .network-dot.green { background-color: #00ffaa; box-shadow: 0 0 10px #00ffaa; }
        .network-dot.yellow { background-color: #ffcc00; box-shadow: 0 0 10px #ffcc00; }
        .network-dot.red { background-color: #ff3333; box-shadow: 0 0 10px #ff3333; animation: blink-dot 1s infinite; }
        @keyframes blink-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }

        .divider {
            width: 86%; height: 5px; background-color: var(--clock-color);
            margin-bottom: 0px; transition: background-color 1s ease;
        }

        /* --- CLOCK LAYOUT --- */
        #clock-positioner {
            display: flex; justify-content: center; align-items: center;
            transform-origin: top center; margin-top: 25px; padding: 10px;
            border: 2px solid transparent; cursor: grab; transition: font-family 0.3s ease;
        }

        .edit-mode #header-positioner, .edit-mode #clock-positioner {
            border: 2px dashed rgba(255, 255, 255, 0.3); border-radius: 20px;
        }
        .edit-mode #header-positioner.active-target, .edit-mode #clock-positioner.active-target {
            border: 2px dashed rgba(0, 255, 170, 0.8); background: rgba(0, 255, 170, 0.05);
        }

        .time-container { display: flex; align-items: center; justify-content: center; pointer-events: none; }
        .digit-window { height: 380px; width: 180px; overflow: hidden; position: relative; }
        .tens-window { margin-right: 15px; }
        
        .digit-strip {
            display: flex; flex-direction: column;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); will-change: transform;
        }

        .digit {
            height: 380px; line-height: 380px; font-size: 480px; width: 180px;
            text-align: center; display: flex; justify-content: center; align-items: center;
        }

        .separator {
            font-size: 300px; line-height: 380px; font-weight: bold; margin: 0 10px;
            transform: translateY(-35px); animation: blink 1s step-end infinite;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* --- MENUS --- */
        .settings-overlay {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(20, 20, 20, 0.95); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 255, 255, 0.2); padding: 30px; border-radius: 20px;
            z-index: 1000; flex-direction: column; align-items: center; gap: 15px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9); font-family: -apple-system, sans-serif; min-width: 320px;
        }

        .close-btn {
            position: absolute; top: 10px; right: 15px; background: none; border: none;
            color: #ffffff; font-size: 24px; font-weight: bold; cursor: pointer; opacity: 0.7;
        }

        .settings-btn {
            background: #ffffff; color: #000000; border: none; padding: 10px 20px;
            font-size: 16px; font-weight: bold; border-radius: 10px; cursor: pointer; width: 100%;
        }
        .settings-btn.accent { background: #00ffaa; color: #000; }
        .settings-btn.message-btn { background: #ffcc00; color: #000; margin-bottom: 10px; }

        .toggle-row { display: flex; justify-content: space-between; align-items: center; width: 100%; gap: 15px; font-size: 16px; font-weight: bold; }
        .custom-select, .color-picker { background: #333; color: #fff; border: 1px solid #555; padding: 6px; border-radius: 8px; font-size: 14px; font-weight: bold; outline: none; }
        .color-picker { padding: 0; height: 30px; width: 50px; border: none; cursor: pointer; }

        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #555; transition: .4s; border-radius: 28px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #00ffaa; }
        input:checked + .slider:before { transform: translateX(20px); }

        /* --- MESSAGE BOARD OVERLAY --- */
        .message-board {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 10, 0.98); z-index: 4000; flex-direction: column;
            padding: 40px 20px; font-family: -apple-system, sans-serif; overflow-y: auto; color: white;
        }
        .message-board-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .message-board-title { font-size: 24px; font-weight: bold; color: #00ffaa; }
        .close-msg-btn { background: none; border: none; color: white; font-size: 28px; cursor: pointer; }
        
        #message-list { display: flex; flex-direction: column; gap: 15px; }
        .msg-card { background: #1a1a1a; padding: 15px; border-radius: 12px; border-left: 6px solid #555; display: flex; flex-direction: column; gap: 8px; }
        .msg-card.High { border-left-color: #ff3333; }
        .msg-card.Low { border-left-color: #00ffaa; }
        .msg-text { font-size: 18px; font-weight: bold; }
        .msg-meta { font-size: 13px; color: #888; display: flex; justify-content: space-between; }
        .loading-text { text-align: center; color: #aaa; font-style: italic; margin-top: 20px; }

        /* --- NEW: FULL SCREEN ALERT UI --- */
        #fullscreen-alert {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 5000; flex-direction: column; justify-content: center;
            align-items: center; padding: 40px; text-align: center; font-family: -apple-system, sans-serif;
            cursor: pointer; 
        }
        #alert-text {
            font-weight: bold;
            line-height: 1.2; word-wrap: break-word; max-width: 90%;
            /* Font size is now dynamically controlled by JS */
        }
        .alert-hint {
            position: absolute; bottom: 30px; font-size: 16px; color: rgba(150,150,150,0.8); font-weight: bold;
        }
        
        /* Normal Alert Styling */
        .normal-alert { background-color: #000000; }
        .normal-alert #alert-text { color: #ffffff; }

        /* High Priority 3-Color Blinking Effect (Red-Black-White) */
        .blink-red { animation: alert-blink-rbw 1.5s infinite; }
        .blink-red #alert-text { animation: text-color-sync 1.5s infinite; }
        
        @keyframes alert-blink-rbw {
            0%, 32% { background-color: #FF0000; }   /* Pure Red */
            33%, 65% { background-color: #000000; }  /* Black */
            66%, 99% { background-color: #FFFFFF; }  /* White */
            100% { background-color: #FF0000; }
        }
        
        /* Keeps text readable depending on the background flash */
        @keyframes text-color-sync {
            0%, 32% { color: #FFFFFF; }  /* White text on Red bg */
            33%, 65% { color: #FFFFFF; } /* White text on Black bg */
            66%, 99% { color: #FF0000; } /* Pure Red text on White bg */
            100% { color: #FFFFFF; }
        }

        /* --- LAYOUT CONTROL PANEL --- */
        .layout-panel {
            display: none; position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(10, 10, 10, 0.95); border: 2px solid #00ffaa; border-radius: 15px;
            padding: 15px 20px; width: 90%; max-width: 500px; z-index: 2000;
            font-family: -apple-system, sans-serif; flex-direction: column; gap: 12px;
            box-shadow: 0 10px 30px rgba(0,255,170,0.2);
        }
        .layout-panel h3 { margin: 0; text-align: center; color: #00ffaa; font-size: 14px; }
        .slider-group { display: flex; flex-direction: column; gap: 5px; }
        .slider-group label { font-weight: bold; font-size: 12px; color: #ccc; }
        input[type=range] { width: 100%; accent-color: #00ffaa; }
        .layout-actions { display: flex; gap: 10px; margin-top: 5px; }
        .layout-actions button { flex: 1; padding: 10px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-save { background: #00ffaa; color: #000; }
        .btn-reset { background: #555; color: #fff; }

    </style>
</head>
<body>

    <!-- Header Block -->
    <div id="header-positioner" data-target="header">
        <div class="date-header">
            <span id="day-marathi">सोमवार</span> 
            <span class="pipe">|</span> 
            <span id="month-marathi">ऑगस्ट</span> 
            <span class="pipe">|</span> 
            <span id="date-num">10/08/2026</span>
            <span class="pipe">|</span> 
            <div id="sec-wrapper">
                <span id="sec-num">00</span>
                <span id="network-dot" class="network-dot green"></span>
            </div>
        </div>
        <div class="divider"></div>
    </div>

    <!-- Clock Block -->
    <div id="clock-positioner" data-target="time">
        <div class="time-container" id="clock">
            <div class="digit-window tens-window"><div class="digit-strip" id="h-tens"></div></div>
            <div class="digit-window"><div class="digit-strip" id="h-units"></div></div>
            <div class="separator">:</div>
            <div class="digit-window tens-window"><div class="digit-strip" id="m-tens"></div></div>
            <div class="digit-window"><div class="digit-strip" id="m-units"></div></div>
        </div>
    </div>

    <!-- Main Settings Menu -->
    <div class="settings-overlay" id="settings-menu">
        <button class="close-btn" id="close-settings">✕</button>
        
        <button class="settings-btn message-btn" id="open-messages-btn">View Incoming Messages</button>
        
        <button class="settings-btn" id="fullscreen-btn">Toggle Full Screen</button>
        <button class="settings-btn accent" id="edit-layout-btn">Edit Layout</button>

        <div class="toggle-row">
            <span>Day Color</span>
            <input type="color" id="day-color" class="color-picker" value="#ffffff">
        </div>
        <div class="toggle-row">
            <span>Night Color (10 PM - 6 AM)</span>
            <input type="color" id="night-color" class="color-picker" value="#00aaff">
        </div>
        <div class="toggle-row">
            <span>Auto Night Color Mode</span>
            <label class="switch"><input type="checkbox" id="night-toggle" checked><span class="slider"></span></label>
        </div>
        <div class="toggle-row">
            <span>12-Hour Format</span>
            <label class="switch"><input type="checkbox" id="format-toggle"><span class="slider"></span></label>
        </div>
    </div>

    <!-- Message Board Overlay -->
    <div class="message-board" id="message-board">
        <div class="message-board-header">
            <span class="message-board-title">Incoming Messages</span>
            <button class="close-msg-btn" id="close-messages">✕</button>
        </div>
        <div id="message-list">
            <div class="loading-text">Loading messages securely...</div>
        </div>
    </div>

    <!-- NEW: FULL SCREEN ALERT -->
    <div id="fullscreen-alert">
        <div id="alert-text"></div>
        <div class="alert-hint">Double Tap to dismiss</div>
    </div>

    <!-- Layout Editor Panel -->
    <div class="layout-panel" id="layout-panel">
        <h3 id="layout-title">EDITING: CLOCK</h3>
        <div class="slider-group">
            <label>Selected Element Font</label>
            <select id="layout-font-select" class="custom-select" style="width: 100%;">
                <option value="'Teko Local', sans-serif">Teko (Local)</option>
                <option value="'Orbitron', sans-serif">Orbitron</option>
                <option value="'Bebas Neue', sans-serif">Bebas Neue</option>
                <option value="'Oswald', sans-serif">Oswald</option>
                <option value="'Rajdhani', sans-serif">Rajdhani</option>
                <option value="'Righteous', cursive">Righteous</option>
                <option value="'Share Tech Mono', monospace">Share Tech Mono</option>
                <option value="'Rubik Mono One', sans-serif">Rubik Mono</option>
            </select>
        </div>
        <div class="slider-group"><label>Stretch Width</label><input type="range" id="scale-x" min="0.5" max="1.2" step="0.01" value="1"></div>
        <div class="slider-group"><label>Stretch Height</label><input type="range" id="scale-y" min="0.5" max="1.5" step="0.01" value="1"></div>
        <div class="layout-actions">
            <button class="btn-reset" id="layout-reset">Reset Default</button>
            <button class="btn-save" id="layout-save">Close Editor</button>
        </div>
    </div>

    <script>
        // --- YOUR CONNECTED GOOGLE APP SCRIPT ---
        const GOOGLE_APP_URL = "https://script.google.com/macros/s/AKfycbwnGUMYmNW0gidnQFyHVFIzyRWRTZPwiquQZ9aYkIlT9x6VQ7cIrlfQiV5COSO05mv5/exec";
        // ----------------------------------------

        const safeStorage = {
            get: function(key, fallback) { try { let val = localStorage.getItem(key); return val !== null ? val : fallback; } catch(e) { return fallback; } },
            set: function(key, value) { try { localStorage.setItem(key, value); } catch(e) {} }
        };

        window.oncontextmenu = function(e) { e.preventDefault(); e.stopPropagation(); return false; };

        const DIGIT_HEIGHT = 380; 
        let is12Hour = safeStorage.get('is12Hour', 'false') === 'true';
        let headerFont = safeStorage.get('headerFont', "'Teko Local', sans-serif");
        let timeFont = safeStorage.get('timeFont', "'Teko Local', sans-serif");
        let dayColor = safeStorage.get('dayColor', "#ffffff");
        let nightColor = safeStorage.get('nightColor', "#00aaff");
        let autoNightMode = safeStorage.get('autoNightMode', 'true') !== 'false';
        
        document.getElementById('header-positioner').style.fontFamily = headerFont;
        document.getElementById('clock-positioner').style.fontFamily = timeFont;
        document.getElementById('format-toggle').checked = is12Hour;
        document.getElementById('day-color').value = dayColor;
        document.getElementById('night-color').value = nightColor;
        document.getElementById('night-toggle').checked = autoNightMode;

        const networkDot = document.getElementById('network-dot');
        function checkNetwork() {
            try {
                if (!navigator.onLine) { networkDot.className = 'network-dot red'; } 
                else {
                    fetch('https://1.1.1.1/cdn-cgi/trace', { mode: 'no-cors', cache: 'no-store' })
                    .then(() => { networkDot.className = 'network-dot green'; })
                    .catch(() => { networkDot.className = 'network-dot yellow'; });
                }
            } catch(e) {}
        }
        window.addEventListener('online', checkNetwork); window.addEventListener('offline', checkNetwork);
        setInterval(checkNetwork, 10000); checkNetwork();

        function updateColors() {
            try {
                const hour = new Date().getHours();
                if (autoNightMode && (hour >= 22 || hour < 6)) { document.documentElement.style.setProperty('--clock-color', nightColor); } 
                else { document.documentElement.style.setProperty('--clock-color', dayColor); }
            } catch(e) {}
        }
        setInterval(updateColors, 60000); updateColors(); 

        document.getElementById('day-color').addEventListener('input', (e) => { dayColor = e.target.value; safeStorage.set('dayColor', dayColor); updateColors(); resetHideTimer(); });
        document.getElementById('night-color').addEventListener('input', (e) => { nightColor = e.target.value; safeStorage.set('nightColor', nightColor); updateColors(); resetHideTimer(); });
        document.getElementById('night-toggle').addEventListener('change', (e) => { autoNightMode = e.target.checked; safeStorage.set('autoNightMode', autoNightMode); updateColors(); resetHideTimer(); });

        const marathiDays = ["रविवार", "सोमवार", "मंगळवार", "बुधवार", "गुरुवार", "शुक्रवार", "शनिवार"];
        const marathiMonths = ["जानेवारी", "फेब्रुवारी", "मार्च", "एप्रिल", "मे", "जून", "जुलै", "ऑगस्ट", "सप्टेंबर", "ऑक्टोबर", "नोव्हेंबर", "डिसेंबर"];

        function buildStrip(id, maxNumber) {
            try {
                const strip = document.getElementById(id); let html = '';
                for (let i = 0; i <= maxNumber; i++) { html += `<div class="digit">${i}</div>`; }
                strip.innerHTML = html;
            } catch(e) {}
        }
        buildStrip('h-tens', 2); buildStrip('h-units', 9); buildStrip('m-tens', 5); buildStrip('m-units', 9);

        function updateStrip(id, value) {
            try {
                const strip = document.getElementById(id);
                strip.style.transform = `translate3d(0, ${-(value * DIGIT_HEIGHT)}px, 0)`;
            } catch(e) {}
        }

        function updateDateHeader(now) {
            if (isEditMode) {
                document.getElementById('day-marathi').textContent = "WWWWW";
                document.getElementById('month-marathi').textContent = "MMMM";
                document.getElementById('date-num').textContent = "DD/MM/YYYY";
                document.getElementById('sec-num').textContent = "SS"; return; 
            }
            try {
                document.getElementById('day-marathi').textContent = marathiDays[now.getDay()];
                document.getElementById('month-marathi').textContent = marathiMonths[now.getMonth()];
                document.getElementById('date-num').textContent = `${String(now.getDate()).padStart(2, '0')}/${String(now.getMonth() + 1).padStart(2, '0')}/${now.getFullYear()}`;
                document.getElementById('sec-num').textContent = String(now.getSeconds()).padStart(2, '0');
            } catch (err) {}
        }

        function updateClock() {
            try {
                const now = new Date(); let rawHours = now.getHours();
                if (is12Hour) { rawHours = rawHours % 12; rawHours = rawHours ? rawHours : 12; }
                const hours = String(rawHours).padStart(2, '0'); const minutes = String(now.getMinutes()).padStart(2, '0');
                updateStrip('h-tens', parseInt(hours[0])); updateStrip('h-units', parseInt(hours[1]));
                updateStrip('m-tens', parseInt(minutes[0])); updateStrip('m-units', parseInt(minutes[1]));
                updateDateHeader(now);
            } catch(e) {}
            requestAnimationFrame(updateClock);
        }
        try { updateClock(); } catch(e) {}

        const timePos = document.getElementById('clock-positioner'); const headerPos = document.getElementById('header-positioner');
        const layoutPanel = document.getElementById('layout-panel'); const layoutTitle = document.getElementById('layout-title');
        const scaleXSlider = document.getElementById('scale-x'); const scaleYSlider = document.getElementById('scale-y');
        const layoutFontSelect = document.getElementById('layout-font-select');
        
        let isEditMode = false; let activeTarget = 'time'; 
        const DEFAULT_LAYOUT = { time: { x: 15, y: -11, sx: 1.05, sy: 0.9 }, header: { x: 0, y: 15, sx: 1.05, sy: 1 } };
        let layout = JSON.parse(JSON.stringify(DEFAULT_LAYOUT)); 
        try { const savedStr = safeStorage.get('dualLayout', null); if (savedStr) { let parsed = JSON.parse(savedStr); if(parsed && parsed.time && parsed.header) layout = parsed; } } catch(e) {}

        function autoSaveLayout() { safeStorage.set('dualLayout', JSON.stringify(layout)); }
        function applyTransforms() {
            try {
                timePos.style.transform = `translate(${layout.time.x}px, ${layout.time.y}px) scale(${layout.time.sx}, ${layout.time.sy})`;
                headerPos.style.transform = `translate(${layout.header.x}px, ${layout.header.y}px) scale(${layout.header.sx}, ${layout.header.sy})`;
            } catch(e) {}
        }
        applyTransforms();

        function loadTargetToSliders() {
            scaleXSlider.value = layout[activeTarget].sx; scaleYSlider.value = layout[activeTarget].sy;
            timePos.classList.remove('active-target'); headerPos.classList.remove('active-target');
            if(activeTarget === 'time') { timePos.classList.add('active-target'); layoutTitle.textContent = "EDITING: CLOCK (Tap Header to edit)"; scaleXSlider.max = 1.3; layoutFontSelect.value = timeFont; } 
            else { headerPos.classList.add('active-target'); layoutTitle.textContent = "EDITING: HEADER (Tap Clock to edit)"; scaleXSlider.max = 1.15; layoutFontSelect.value = headerFont; }
        }

        layoutFontSelect.addEventListener('change', (e) => {
            if (activeTarget === 'header') { headerFont = e.target.value; headerPos.style.fontFamily = headerFont; safeStorage.set('headerFont', headerFont); } 
            else { timeFont = e.target.value; timePos.style.fontFamily = timeFont; safeStorage.set('timeFont', timeFont); }
        });
        scaleXSlider.addEventListener('input', (e) => { layout[activeTarget].sx = parseFloat(e.target.value); applyTransforms(); autoSaveLayout(); });
        scaleYSlider.addEventListener('input', (e) => { layout[activeTarget].sy = parseFloat(e.target.value); applyTransforms(); autoSaveLayout(); });

        let isDragging = false; let startX, startY, initialX, initialY; let dragTarget = null; 
        function startDrag(e, targetStr) {
            if (!isEditMode) return; isDragging = true; dragTarget = targetStr; activeTarget = targetStr; loadTargetToSliders();    
            let touchX = e.touches ? e.touches[0].clientX : e.clientX; let touchY = e.touches ? e.touches[0].clientY : e.clientY;
            startX = touchX; startY = touchY; initialX = layout[dragTarget].x; initialY = layout[dragTarget].y;
        }
        function moveDrag(e) {
            if (!isDragging || !isEditMode || !dragTarget) return; e.preventDefault(); 
            let touchX = e.touches ? e.touches[0].clientX : e.clientX; let touchY = e.touches ? e.touches[0].clientY : e.clientY;
            const maxMoveX = window.innerWidth / 3; const maxMoveY = window.innerHeight / 3;
            layout[dragTarget].x = Math.max(-maxMoveX, Math.min(maxMoveX, initialX + (touchX - startX)));
            layout[dragTarget].y = Math.max(-maxMoveY, Math.min(maxMoveY, initialY + (touchY - startY)));
            applyTransforms();
        }
        function endDrag() { if (isDragging) { isDragging = false; dragTarget = null; autoSaveLayout(); } }

        timePos.addEventListener('touchstart', (e) => startDrag(e, 'time')); timePos.addEventListener('mousedown', (e) => startDrag(e, 'time'));
        headerPos.addEventListener('touchstart', (e) => startDrag(e, 'header')); headerPos.addEventListener('mousedown', (e) => startDrag(e, 'header'));
        window.addEventListener('touchmove', moveDrag, {passive: false}); window.addEventListener('mousemove', moveDrag);
        window.addEventListener('touchend', endDrag); window.addEventListener('mouseup', endDrag);

        document.getElementById('edit-layout-btn').addEventListener('click', () => {
            hideSettings(); isEditMode = true; document.body.classList.add('edit-mode');
            layoutPanel.style.display = 'flex'; activeTarget = 'time'; loadTargetToSliders();
        });
        document.getElementById('layout-save').addEventListener('click', () => {
            isEditMode = false; document.body.classList.remove('edit-mode'); layoutPanel.style.display = 'none';
            timePos.classList.remove('active-target'); headerPos.classList.remove('active-target'); autoSaveLayout();
        });
        document.getElementById('layout-reset').addEventListener('click', () => { layout = JSON.parse(JSON.stringify(DEFAULT_LAYOUT)); loadTargetToSliders(); applyTransforms(); autoSaveLayout(); });

        const settingsMenu = document.getElementById('settings-menu'); const fullscreenBtn = document.getElementById('fullscreen-btn');
        let hideTimeout; let wakeLock = null;

        async function requestWakeLock() { if ('wakeLock' in navigator) { try { wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {} } }
        function releaseWakeLock() { if (wakeLock !== null) { wakeLock.release().then(() => { wakeLock = null; }); } }

        function showSettings() { if(isEditMode || document.getElementById('message-board').style.display === 'flex' || document.getElementById('fullscreen-alert').style.display === 'flex') return; settingsMenu.style.display = 'flex'; resetHideTimer(); }
        function hideSettings() { settingsMenu.style.display = 'none'; clearTimeout(hideTimeout); }
        function resetHideTimer() { clearTimeout(hideTimeout); hideTimeout = setTimeout(hideSettings, 10000); }

        document.getElementById('close-settings').addEventListener('click', hideSettings);
        document.getElementById('format-toggle').addEventListener('change', function(e) { is12Hour = e.target.checked; safeStorage.set('is12Hour', is12Hour); resetHideTimer(); });

        fullscreenBtn.addEventListener('click', function() {
            try {
                if (!document.fullscreenElement) { document.documentElement.requestFullscreen().then(() => { requestWakeLock(); }).catch(err => {}); } 
                else { if (document.exitFullscreen) { document.exitFullscreen().then(() => { releaseWakeLock(); }); } }
            } catch(e) {}
            hideSettings();
        });
        document.addEventListener('visibilitychange', async () => { if (wakeLock !== null && document.visibilityState === 'visible') { requestWakeLock(); } });

        // --- GLOBAL DOUBLE TAP LOGIC ---
        let lastTapTime = 0;
        document.body.addEventListener('click', function(e) {
            const tapLength = new Date().getTime() - lastTapTime;
            
            // Allow double tapping the full-screen alert to close it instantly
            if (e.target.closest('#fullscreen-alert')) {
                if (tapLength < 300 && tapLength > 0) { dismissFullscreenAlert(); }
                lastTapTime = new Date().getTime();
                return;
            }

            if (e.target.closest('#settings-menu') || e.target.closest('#layout-panel') || e.target.closest('#message-board') || isEditMode) return;
            
            if (tapLength < 300 && tapLength > 0) { showSettings(); }
            lastTapTime = new Date().getTime();
        });


        // --- LIVE MESSAGING LOGIC (BACKGROUND POLLING) ---
        const messageBoard = document.getElementById('message-board');
        const messageList = document.getElementById('message-list');
        const alertOverlay = document.getElementById('fullscreen-alert');
        const alertText = document.getElementById('alert-text');
        
        let lastSeenMessageId = null;
        let alertTimeout = null;

        document.getElementById('open-messages-btn').addEventListener('click', () => {
            hideSettings();
            messageBoard.style.display = 'flex';
            fetchMessagesForBoard();
        });
        document.getElementById('close-messages').addEventListener('click', () => { messageBoard.style.display = 'none'; });

        function fetchMessagesForBoard() {
            messageList.innerHTML = `<div class="loading-text">Fetching latest messages...</div>`;
            fetch(GOOGLE_APP_URL)
                .then(response => response.json())
                .then(data => {
                    messageList.innerHTML = ''; 
                    if (data.length === 0) { messageList.innerHTML = `<div class="loading-text">No messages right now.</div>`; return; }

                    data.forEach(msg => {
                        if(!msg.message && !msg.date) return;
                        let safePriority = (msg.priority || "Normal").trim();
                        let safeMsg = msg.message || "[Empty Message]";
                        let safeDate = msg.date || "";

                        let card = document.createElement('div');
                        card.className = `msg-card ${safePriority}`;
                        card.innerHTML = `<div class="msg-text">${safeMsg}</div><div class="msg-meta"><span>Priority: ${safePriority}</span><span>${safeDate}</span></div>`;
                        messageList.appendChild(card);
                    });
                })
                .catch(error => { messageList.innerHTML = `<div class="loading-text" style="color:red;">Failed to load messages.</div>`; });
        }

        function checkLatestMessage() {
            fetch(GOOGLE_APP_URL)
                .then(response => response.json())
                .then(data => {
                    if (data.length === 0) return;
                    
                    const newestMsg = data[0];
                    if(!newestMsg.message && !newestMsg.date) return; 

                    const currentMessageId = newestMsg.date + newestMsg.message;

                    if (lastSeenMessageId === null) {
                        lastSeenMessageId = currentMessageId;
                        return;
                    }

                    if (currentMessageId !== lastSeenMessageId) {
                        lastSeenMessageId = currentMessageId;
                        triggerFullscreenAlert(newestMsg.message, newestMsg.priority);
                    }
                })
                .catch(e => console.log("Background check error", e));
        }

        function triggerFullscreenAlert(msg, priority) {
            clearTimeout(alertTimeout);
            alertText.textContent = msg;
            
            // --- DYNAMIC FONT SIZING ---
            const charCount = msg.length;
            if (charCount < 15) {
                // SUPER SIZE: For single words like "TEST"
                alertText.style.fontSize = "clamp(100px, 25vw, 250px)";
            } else if (charCount < 35) {
                // Short text like "Check all Connections"
                alertText.style.fontSize = "clamp(60px, 15vw, 160px)";
            } else if (charCount < 110) {
                // Medium text like "Ensure the machine is installed..."
                alertText.style.fontSize = "clamp(40px, 9vw, 100px)";
            } else {
                // Long text like "Use designated lifting points..."
                alertText.style.fontSize = "clamp(22px, 5vw, 65px)";
            }
            
            const isHighPriority = (priority || "").toLowerCase() === 'high';
            
            if (isHighPriority) {
                alertOverlay.className = 'blink-red';
                alertOverlay.style.display = 'flex';
                // Show for 10 minutes (600,000 ms)
                alertTimeout = setTimeout(dismissFullscreenAlert, 600000);
            } else {
                alertOverlay.className = 'normal-alert';
                alertOverlay.style.display = 'flex';
                // Show for 5 minutes (300,000 ms)
                alertTimeout = setTimeout(dismissFullscreenAlert, 300000);
            }
        }

        function dismissFullscreenAlert() {
            clearTimeout(alertTimeout);
            alertOverlay.style.display = 'none';
            alertOverlay.className = '';
        }

        // Changed interval from 30 seconds to 5 seconds!
        setInterval(checkLatestMessage, 5000);
        setTimeout(checkLatestMessage, 3000);

    </script>
</body>
</html>
