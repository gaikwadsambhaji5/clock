<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Realme Smart Telemetry Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d0d0d;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Screen Containers */
    .screen {
      display: none;
      width: 100%;
      height: 100%;
      padding: 2rem;
      text-align: center;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .active {
      display: flex;
    }

    /* #Image 01: Full Screen Desk Clock */
    #IMAGE_01 {
      background: radial-gradient(circle, #1a1a1a 0%, #000000 100%);
    }

    .desk-clock {
      font-size: 8rem;
      font-weight: 700;
      letter-spacing: -2px;
      color: #00e5ff;
      text-shadow: 0 0 20px rgba(0, 229, 255, 0.4);
    }

    .desk-date {
      font-size: 1.8rem;
      color: #888888;
      margin-top: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    /* #Image 02: Commute / Office Dashboard */
    #IMAGE_02 {
      background: linear-gradient(135deg, #111111 0%, #1f1f1f 100%);
      border: 4px solid #333333;
    }

    .status-title {
      font-size: 1.5rem;
      color: #aaaaaa;
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-bottom: 1rem;
    }

    .area-name {
      font-size: 3.5rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 1.5rem;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.5rem;
      width: 80%;
      max-width: 600px;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.05);
      padding: 1.5rem;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .stat-value {
      font-size: 2.2rem;
      font-weight: 700;
      color: #00e5ff;
    }

    .stat-label {
      font-size: 0.9rem;
      color: #888888;
      margin-top: 0.3rem;
      text-transform: uppercase;
    }

    .message-box {
      font-size: 1.5rem;
      color: #00ff66;
      background: rgba(0, 255, 102, 0.1);
      padding: 1rem 2rem;
      border-radius: 50px;
      border: 1px solid #00ff66;
      max-width: 80%;
    }

    /* #Image 03: Welcome Home Screen */
    #IMAGE_03 {
      background: radial-gradient(circle, #003319 0%, #000000 100%);
    }

    .welcome-text {
      font-size: 5rem;
      font-weight: 800;
      color: #00ff66;
      text-shadow: 0 0 30px rgba(0, 255, 102, 0.6);
      margin-bottom: 1rem;
    }

    .welcome-sub {
      font-size: 1.8rem;
      color: #cccccc;
    }

    /* Flashing Red Alert Animation */
    .red-alert {
      animation: flash-red 0.8s infinite alternate !important;
      border-color: #ff0033 !important;
      color: #ffffff !important;
    }

    @keyframes flash-red {
      0% { background-color: #ff0033; }
      100% { background-color: #660011; }
    }
  </style>
</head>
<body>

  <!-- ================= SCREEN 1: DESK CLOCK ================= -->
  <div id="IMAGE_01" class="screen active">
    <div id="desk-time" class="desk-clock">00:00</div>
    <div id="desk-date" class="desk-date">Loading Date...</div>
  </div>

  <!-- ================= SCREEN 2: COMMUTE / OFFICE ================= -->
  <div id="IMAGE_02" class="screen">
    <div class="status-title" id="mode-title">Live Commute Telemetry</div>
    <div class="area-name" id="location-text">Waiting for GPS...</div>
    
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value" id="distance-text">-- km</div>
        <div class="stat-label">Distance to Target</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="battery-text">--%</div>
        <div class="stat-label">iPhone Battery</div>
      </div>
    </div>

    <div class="message-box" id="message-text">System Standby</div>
  </div>

  <!-- ================= SCREEN 3: WELCOME HOME ================= -->
  <div id="IMAGE_03" class="screen">
    <div class="welcome-text">WELCOME HOME</div>
    <div class="welcome-sub">Automation Loop Terminated. Have a restful evening!</div>
  </div>

  <script>
    // ==========================================
    // 1. CONFIGURATION & CONSTANTS
    // ==========================================
    const SHEETS_URL = "https://script.google.com/macros/s/AKfycbwoVN3MISz0MwReTTRI3OCDlz773F8wxH3acISFOpHqo1qd7LhKFD4AWWYic13fBSAuzw/exec";

    // Hardcoded GPS Coordinates
    const HOME_LAT = 19.86574625237041;
    const HOME_LNG = 75.2437856839912;
    const OFFICE_LAT = 19.829540680618862;
    const OFFICE_LNG = 75.19337422921791;

    let resetTimer = null;

    // ==========================================
    // 2. LIVE DESK CLOCK FUNCTION (IMAGE 01)
    // ==========================================
    function updateClock() {
      const now = new Date();
      
      // Format time (HH:MM)
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById("desk-time").innerText = `${hours}:${minutes}`;

      // Format date (e.g., FRIDAY, JULY 31)
      const options = { weekday: 'long', month: 'long', day: 'numeric' };
      document.getElementById("desk-date").innerText = now.toLocaleDateString('en-US', options);
    }
    setInterval(updateClock, 1000);
    updateClock();

    // ==========================================
    // 3. UI SCREEN MANAGEMENT
    // ==========================================
    function showScreen(screenId) {
      document.querySelectorAll(".screen").forEach(screen => {
        screen.classList.remove("active");
      });
      document.getElementById(screenId).classList.add("active");
    }

    // ==========================================
    // 4. HAVERSINE DISTANCE FORMULA (KM)
    // ==========================================
    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371; // Earth's radius in kilometers
      const dLat = (lat2 - lat1) * (Math.PI / 180);
      const dLon = (lon2 - lon1) * (Math.PI / 180);
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * (Math.PI / 180)) *
        Math.cos(lat2 * (Math.PI / 180)) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return (R * c).toFixed(1);
    }

    // ==========================================
    // 5. FETCH DATA & HANDLE AUTOMATION LOGIC
    // ==========================================
    async function fetchDashboardData() {
      try {
        const response = await fetch(SHEETS_URL);
        const data = await response.json();

        // Clear any running 2-minute reset timer if new data arrives
        if (resetTimer) {
          clearTimeout(resetTimer);
          resetTimer = null;
        }

        const messageEl = document.getElementById("message-text");
        messageEl.classList.remove("red-alert"); // Clear flashing alert by default

        // ---- MODE 1: COMMUTE HOME (OFFICE TO HOME) ----
        if (data.mode === "COMMUTE") {
          showScreen("IMAGE_02");
          document.getElementById("mode-title").innerText = "Driving Home Telemetry";
          document.getElementById("location-text").innerText = data.locName || "In Transit";
          document.getElementById("battery-text").innerText = `${data.battery}%`;
          document.getElementById("message-text").innerText = data.message || "Heading Home...";

          if (data.lat && data.lng) {
            const dist = calculateDistance(data.lat, data.lng, HOME_LAT, HOME_LNG);
            document.getElementById("distance-text").innerText = `${dist} km`;
          }
        }

        // ---- MODE 2: COMMUTE TO OFFICE (HOME TO OFFICE) ----
        else if (data.mode === "TO_OFFICE") {
          showScreen("IMAGE_02");
          document.getElementById("mode-title").innerText = "Morning Commute Telemetry";
          document.getElementById("location-text").innerText = data.locName || "In Transit";
          document.getElementById("battery-text").innerText = `${data.battery}%`;
          document.getElementById("message-text").innerText = "Driving to Office...";

          if (data.lat && data.lng) {
            const dist = calculateDistance(data.lat, data.lng, OFFICE_LAT, OFFICE_LNG);
            document.getElementById("distance-text").innerText = `${dist} km`;
          }
        }

        // ---- MODE 3: ARRIVED AT OFFICE (HOLD 2 MINS -> CLOCK) ----
        else if (data.mode === "OFFICE_ARRIVED") {
          showScreen("IMAGE_02");
          document.getElementById("mode-title").innerText = "Destination Reached";
          document.getElementById("location-text").innerText = "OFFICE";
          document.getElementById("distance-text").innerText = "0.0 km";
          document.getElementById("battery-text").innerText = `${data.battery}%`;
          
          messageEl.innerText = "ARRIVED AT OFFICE! Have a great day!";
          
          // Auto-reset to Image 01 (Desk Clock) after 2 minutes (120,000 ms)
          resetTimer = setTimeout(() => {
            showScreen("IMAGE_01");
          }, 120000);
        }

        // ---- MODE 4: ARRIVED HOME ----
        else if (data.mode === "HOME") {
          showScreen("IMAGE_03");
          
          // Optional: Return to Desk Clock after 5 minutes of Home display
          resetTimer = setTimeout(() => {
            showScreen("IMAGE_01");
          }, 300000);
        }

        // ---- MODE 5: RED ALERT / URGENT MESSAGE ----
        else if (data.mode === "ALERT") {
          showScreen("IMAGE_02");
          document.getElementById("mode-title").innerText = "INCOMING ALERT";
          document.getElementById("location-text").innerText = "ATTENTION";
          messageEl.innerText = data.message || "URGENT NOTIFICATION";
          messageEl.classList.add("red-alert"); // Activates the flash-red animation
        }

        // ---- DEFAULT: DESK CLOCK ----
        else {
          showScreen("IMAGE_01");
        }

      } catch (error) {
        console.error("Failed to fetch dashboard data:", error);
      }
    }

    // Poll the Google App Script URL every 5 seconds for instant updates
    setInterval(fetchDashboardData, 5000);
    fetchDashboardData();
  </script>
</body>
</html>
