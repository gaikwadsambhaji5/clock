<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Commute Dashboard</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-green: #4ade80;
            --accent-yellow: #facc15;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .dashboard-container {
            background-color: var(--card-bg);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .status-badge {
            display: inline-block;
            background-color: rgba(56, 189, 248, 0.15);
            color: var(--accent-blue);
            padding: 8px 16px;
            border-radius: 9999px;
            font-weight: 600;
            font-size: 0.875rem;
            margin-bottom: 24px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .status-badge.home {
            background-color: rgba(74, 222, 128, 0.15);
            color: var(--accent-green);
        }

        .distance-display {
            font-size: 4.5rem;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .unit {
            font-size: 1.5rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-left: 4px;
        }

        .label {
            color: var(--text-secondary);
            font-size: 1rem;
            margin-bottom: 32px;
        }

        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 24px;
        }

        .detail-card {
            background: rgba(15, 23, 42, 0.5);
            padding: 16px;
            border-radius: 12px;
        }

        .detail-title {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .detail-value {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .timestamp {
            margin-top: 24px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div id="statusBadge" class="status-badge">Checking Status...</div>
        
        <div class="distance-display">
            <span id="distanceValue">--</span><span class="unit">km</span>
        </div>
        <div class="label">Distance from Home</div>

        <div class="details-grid">
            <div class="detail-card">
                <div class="detail-title">Current Lat</div>
                <div id="latValue" class="detail-value">--</div>
            </div>
            <div class="detail-card">
                <div class="detail-title">Current Lon</div>
                <div id="lonValue" class="detail-value">--</div>
            </div>
        </div>

        <div id="timeValue" class="timestamp">Waiting for GPS data...</div>
    </div>

    <script>
        // 1. CONFIGURATION
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzIcu7PV5yRtymEUrim0gVUQ-lBwLOM0VHWpcCayhaNacX9x_Xvkxgt9T1aKptVtxi7QQ/exec';
        const HOME_LAT = 19.865694;
        const HOME_LON = 75.243806;
        const REFRESH_RATE_MS = 10000; // Refreshes every 10 seconds

        // 2. HAVERSINE DISTANCE FORMULA (Calculates km between two GPS coordinates)
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // Earth's radius in km
            const dLat = (lat2 - lat1) * (Math.PI / 180);
            const dLon = (lon2 - lon1) * (Math.PI / 180);
            const a = 
                Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * (Math.PI / 180)) * Math.cos(lat2 * (Math.PI / 180)) * 
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return (R * c).toFixed(2); // Returns distance fixed to 2 decimal places
        }

        // 3. UPDATE THE DASHBOARD UI
        function updateUI(lat, lon, timeStr) {
            const distance = calculateDistance(lat, lon, HOME_LAT, HOME_LON);

            // Update text elements
            document.getElementById('distanceValue').textContent = distance;
            document.getElementById('latValue').textContent = lat.toFixed(4);
            document.getElementById('lonValue').textContent = lon.toFixed(4);
            document.getElementById('timeValue').textContent = `Last updated: ${timeStr || 'Just now'}`;

            // Update status badge based on distance
            const statusBadge = document.getElementById('statusBadge');
            if (distance < 0.20) {
                statusBadge.textContent = '🏡 Arrived at Home';
                statusBadge.classList.add('home');
            } else {
                statusBadge.textContent = '🚗 On The Way';
                statusBadge.classList.remove('home');
            }
        }

        // 4. FETCH DATA FROM GOOGLE APPS SCRIPT
        async function fetchLocation() {
            try {
                const response = await fetch(GOOGLE_SCRIPT_URL);
                if (!response.ok) throw new Error('Network response was not ok');
                
                const data = await response.json();
                
                const currentLat = parseFloat(data.lat);
                const currentLon = parseFloat(data.lon);
                const lastUpdated = data.time;

                if (!isNaN(currentLat) && !isNaN(currentLon)) {
                    updateUI(currentLat, currentLon, lastUpdated);
                } else {
                    console.error('Invalid coordinates received:', data);
                }
            } catch (error) {
                console.error('Error fetching location data:', error);
                document.getElementById('timeValue').textContent = 'Error connecting to Google Sheet';
            }
        }

        // 5. INITIALIZE AND AUTO-REFRESH
        fetchLocation();
        setInterval(fetchLocation, REFRESH_RATE_MS);
    </script>
</body>
</html>
