<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Desk Clock</title>
    <style>
        /* Reset margins and prevent scrolling */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000000; /* Pitch black background */
            color: #ffffff; /* Crisp white text */
            font-family: 'Arial Black', Impact, 'Segoe UI Black', system-ui, sans-serif; 
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Top Center Date Styling */
        #date-display {
            position: absolute;
            top: 6vh;
            left: 0;
            width: 100%;
            text-align: center; 
            font-size: 11vw; 
            font-weight: bold;
            color: #ffffff; 
            font-family: system-ui, -apple-system, sans-serif;
            letter-spacing: 1px;
        }

        /* Massive Center Time Styling */
        #time-display {
            font-size: 42vw; 
            font-weight: 900;
            line-height: 1;
            display: flex;
            align-items: center;
            letter-spacing: -2px; 
            margin-top: 15vh; 
        }

        /* Blinking Colon Animation */
        #colon {
            animation: blink 1s infinite;
            position: relative;
            top: -2.5vw; 
            margin: 0 1vw;
        }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        /* Fullscreen Button Styling */
        #fs-btn {
            position: absolute;
            bottom: 5vh;
            padding: 12px 24px;
            background-color: #222222;
            color: #aaaaaa;
            border: 2px solid #333333;
            border-radius: 30px;
            font-size: 4vw;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            z-index: 10;
            transition: 0.3s ease;
        }

        #fs-btn:active {
            background-color: #444444;
            color: #ffffff;
        }

        /* Tracker Iframe Styling - Covers the whole screen when active */
        #tracker-frame {
            display: none; /* Hidden by default */
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            border: none;
            z-index: 100; /* Puts it above the clock */
            background-color: #000000;
        }

        /* Adjustments for Landscape Mode */
        @media (orientation: landscape) {
            #date-display { 
                font-size: 7vw; 
                top: 8vh;
            }
            #time-display { 
                font-size: 32vw; 
                margin-top: 10vh; 
            }
            #fs-btn {
                font-size: 2vw;
                bottom: 8vh;
                padding: 10px 20px;
            }
        }
    </style>
</head>
<body>

    <!-- Tracker HTML (Hidden until triggered) -->
    <iframe id="tracker-frame" src="traker.html"></iframe>

    <!-- Centered Date at the top -->
    <div id="date-display"></div>

    <!-- Huge time in the center -->
    <div id="time-display">
        <span id="hours"></span><span id="colon">:</span><span id="minutes"></span>
    </div>

    <!-- Fullscreen Toggle Button -->
    <button id="fs-btn">Go Full Screen</button>

    <script>
        // --- CLOCK LOGIC ---
        function updateClock() {
            const now = new Date();

            let rawHours = now.getHours();
            rawHours = rawHours % 12;
            rawHours = rawHours ? rawHours : 12; 

            const hours = String(rawHours).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');

            document.getElementById('hours').textContent = hours;
            document.getElementById('minutes').textContent = minutes;

            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const dayName = days[now.getDay()];
            const day = String(now.getDate()).padStart(2, '0');
            const month = String(now.getMonth() + 1).padStart(2, '0'); 
            const year = now.getFullYear();

            document.getElementById('date-display').textContent = `${day}/${month}/${year} | ${dayName}`;
        }

        updateClock();
        setInterval(updateClock, 1000);

        // --- FULLSCREEN LOGIC ---
        const fsBtn = document.getElementById('fs-btn');

        fsBtn.addEventListener('click', () => {
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen();
            } else if (document.documentElement.webkitRequestFullscreen) {
                document.documentElement.webkitRequestFullscreen();
            }
        });

        document.addEventListener('fullscreenchange', handleFullscreenChange);
        document.addEventListener('webkitfullscreenchange', handleFullscreenChange);

        function handleFullscreenChange() {
            if (document.fullscreenElement || document.webkitFullscreenElement) {
                fsBtn.style.display = 'none';
            } else {
                fsBtn.style.display = 'block';
            }
        }

        // --- GOOGLE SHEETS TRACKER LOGIC ---
        const SHEET_URL = 'https://script.google.com/macros/s/AKfycbzPai0H1EKC7vjoPrDUxBIGoeZh5okjpruynywCP27JS6J2Kt_e66XIeer70TKlvwNbzA/exec';
        
        let lastA1 = null;
        let lastP1 = null;

        async function checkSpreadsheet() {
            try {
                // Fetch the live data from your Google Sheet
                const response = await fetch(SHEET_URL);
                const data = await response.json();
                
                // Trim in case there are invisible spaces in the spreadsheet cell
                const currentA1 = String(data.a1).trim();
                const currentP1 = String(data.p1).trim();

                const trackerFrame = document.getElementById('tracker-frame');

                // Check if A1 just became "0"
                if (currentA1 === "0" && lastA1 !== "0") {
                    trackerFrame.style.display = 'block'; // Show traker.html
                }

                // Check if P1 just became "0"
                if (currentP1 === "0" && lastP1 !== "0") {
                    trackerFrame.style.display = 'none'; // Hide traker.html, show clock
                }

                // Update memory for the next check
                lastA1 = currentA1;
                lastP1 = currentP1;

            } catch (error) {
                console.log("Could not connect to Google Sheets.");
            }
        }

        // Check the Google Sheet every 3 seconds
        setInterval(checkSpreadsheet, 3000);

    </script>

</body>
</html>
