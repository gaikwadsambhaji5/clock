<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Teko Bold Scrolling Clock - Stretched Fit</title>
    <style>
        /* Load the local Teko-Bold font */
        @font-face {
            font-family: 'Teko';
            src: url('Teko-Bold.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
        }

        /* Base Reset & Centering */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Teko', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none; 
            -webkit-user-select: none;
            /* Safe padding to keep text away from the camera notch */
            padding: 0 45px; 
        }

        /* Main Wrapper */
        .clock-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        /* Top Header Container */
        .date-header {
            font-size: 45px; 
            display: flex;
            gap: 15px;
            align-items: baseline;
            letter-spacing: 1px;
            line-height: 1;
            margin-bottom: 0px;
            font-variant-numeric: tabular-nums; 
        }

        .pipe {
            font-size: 35px;
            transform: translateY(-2px);
        }

        #date-num {
            display: inline-block;
            text-align: center;
        }
        
        #sec-num {
            display: inline-block;
            width: 45px; 
            text-align: left;
        }

        /* Horizontal Divider Line */
        .divider {
            width: 100%; 
            height: 5px;
            background-color: #ffffff;
            margin-bottom: 15px; 
        }

        /* Clock Container - STRETCHED VERTICALLY */
        .time-container {
            display: flex;
            align-items: center;
            justify-content: center;
            /* This pulls the text down to fill the bottom without making it wider */
            transform: scaleY(1.45); 
            transform-origin: top center; /* Pins the top in place */
        }

        /* The Window that clips exactly one digit */
        .digit-window {
            height: 210px; /* Locked height */
            width: 140px;  
            overflow: hidden;
            position: relative;
        }
        
        /* Adds the gap between the two numbers in HH and MM */
        .tens-window {
            margin-right: 15px; 
        }

        /* The strip of numbers that slides */
        .digit-strip {
            display: flex;
            flex-direction: column;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: transform;
        }

        /* Individual Digit Styling - PERFECTLY BOUNDED to stop bleeding/shadows */
        .digit {
            height: 210px; /* Matches window exactly */
            line-height: 210px; /* Matches height exactly */
            font-size: 210px; /* Matches height exactly to prevent overflow */
            width: 140px; 
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Blinking Colon Separator */
        .separator {
            font-size: 170px; 
            line-height: 210px;
            font-weight: bold;
            margin: 0 10px; 
            transform: translateY(-12px); 
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Hidden Settings Popup */
        .settings-overlay {
            display: none; 
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            padding: 40px 30px 30px 30px; 
            border-radius: 20px;
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            font-family: -apple-system, sans-serif;
            min-width: 300px;
        }

        /* Close X Button */
        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: #ffffff;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            opacity: 0.7;
        }

        .close-btn:active { opacity: 1; }

        /* Settings UI Elements */
        .settings-btn {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 15px 24px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
        }

        .settings-btn:active { background: #cccccc; }

        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            gap: 20px;
            font-size: 20px;
            font-weight: bold;
        }

        /* Custom Checkbox Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #555; transition: .4s;
            border-radius: 34px;
        }
        .slider:before {
            position: absolute; content: "";
            height: 26px; width: 26px;
            left: 4px; bottom: 4px;
            background-color: white; transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: #00ffaa; }
        input:checked + .slider:before { transform: translateX(26px); }

    </style>
</head>
<body>

    <div class="clock-wrapper" id="main-clock">
        <!-- Date Header -->
        <div class="date-header">
            <span id="day-marathi">सोमवार</span> 
            <span class="pipe">|</span> 
            <span id="month-marathi">ऑगस्ट</span> 
            <span class="pipe">|</span> 
            <span id="date-num">10/08/2026</span>
            <span class="pipe">|</span> 
            <span id="sec-num">00</span>
        </div>

        <!-- Horizontal Line -->
        <div class="divider"></div>

        <!-- Scrolling Clock -->
        <div class="time-container" id="clock">
            <!-- Hours -->
            <div class="digit-window tens-window"><div class="digit-strip" id="h-tens"></div></div>
            <div class="digit-window"><div class="digit-strip" id="h-units"></div></div>
            
            <!-- Colon Separator -->
            <div class="separator">:</div>

            <!-- Minutes -->
            <div class="digit-window tens-window"><div class="digit-strip" id="m-tens"></div></div>
            <div class="digit-window"><div class="digit-strip" id="m-units"></div></div>
        </div>
    </div>

    <!-- Hidden Settings Menu -->
    <div class="settings-overlay" id="settings-menu">
        <button class="close-btn" id="close-settings">✕</button>
        <button class="settings-btn" id="fullscreen-btn">Toggle Full Screen</button>
        
        <div class="toggle-row">
            <span>12-Hour Format</span>
            <label class="switch">
                <input type="checkbox" id="format-toggle">
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <script>
        // --- CLOCK ENGINE ---
        // DIGIT_HEIGHT perfectly matches CSS to eliminate all bleed/shadow issues
        const DIGIT_HEIGHT = 210; 
        let is12Hour = false;

        const marathiDays = ["रविवार", "सोमवार", "मंगळवार", "बुधवार", "गुरुवार", "शुक्रवार", "शनिवार"];
        const marathiMonths = ["जानेवारी", "फेब्रुवारी", "मार्च", "एप्रिल", "मे", "जून", "जुलै", "ऑगस्ट", "सप्टेंबर", "ऑक्टोबर", "नोव्हेंबर", "डिसेंबर"];

        function buildStrip(id, maxNumber) {
            const strip = document.getElementById(id);
            let html = '';
            for (let i = 0; i <= maxNumber; i++) {
                html += `<div class="digit">${i}</div>`;
            }
            strip.innerHTML = html;
        }

        buildStrip('h-tens', 2);
        buildStrip('h-units', 9);
        buildStrip('m-tens', 5);
        buildStrip('m-units', 9);

        function updateStrip(id, value) {
            const strip = document.getElementById(id);
            const translateY = -(value * DIGIT_HEIGHT);
            strip.style.transform = `translate3d(0, ${translateY}px, 0)`;
        }

        function updateDateHeader(now) {
            const day = marathiDays[now.getDay()];
            const month = marathiMonths[now.getMonth()];
            
            const dd = String(now.getDate()).padStart(2, '0');
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const yyyy = now.getFullYear();
            
            const ss = String(now.getSeconds()).padStart(2, '0');

            document.getElementById('day-marathi').textContent = day;
            document.getElementById('month-marathi').textContent = month;
            document.getElementById('date-num').textContent = `${dd}/${mm}/${yyyy}`;
            document.getElementById('sec-num').textContent = ss;
        }

        function updateClock() {
            const now = new Date();
            
            let rawHours = now.getHours();
            
            if (is12Hour) {
                rawHours = rawHours % 12;
                rawHours = rawHours ? rawHours : 12; 
            }

            const hours = String(rawHours).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');

            updateStrip('h-tens', parseInt(hours[0]));
            updateStrip('h-units', parseInt(hours[1]));
            updateStrip('m-tens', parseInt(minutes[0]));
            updateStrip('m-units', parseInt(minutes[1]));

            updateDateHeader(now);
            requestAnimationFrame(updateClock);
        }

        updateClock();

        // --- SETTINGS & SCREEN WAKE LOGIC ---
        const settingsMenu = document.getElementById('settings-menu');
        const formatToggle = document.getElementById('format-toggle');
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const closeBtn = document.getElementById('close-settings');
        let hideTimeout;
        let wakeLock = null;

        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                } catch (err) {
                    console.error(`${err.name}, ${err.message}`);
                }
            }
        }

        function releaseWakeLock() {
            if (wakeLock !== null) {
                wakeLock.release()
                    .then(() => {
                        wakeLock = null;
                    });
            }
        }

        function showSettings() {
            settingsMenu.style.display = 'flex';
            resetHideTimer();
        }

        function hideSettings() {
            settingsMenu.style.display = 'none';
            clearTimeout(hideTimeout);
        }

        function resetHideTimer() {
            clearTimeout(hideTimeout);
            hideTimeout = setTimeout(hideSettings, 10000); 
        }

        closeBtn.addEventListener('click', hideSettings);

        let tapCount = 0;
        let tapTimer;
        
        function handleTap(e) {
            if (e.target.closest('#settings-menu')) return; 
            
            tapCount++;
            clearTimeout(tapTimer);
            
            if (tapCount >= 5) {
                showSettings();
                tapCount = 0;
            } else {
                tapTimer = setTimeout(() => { tapCount = 0; }, 600); 
            }
        }

        document.body.addEventListener('touchend', handleTap);
        document.body.addEventListener('click', handleTap); 

        formatToggle.addEventListener('change', function(e) {
            is12Hour = e.target.checked;
            resetHideTimer(); 
        });

        fullscreenBtn.addEventListener('click', function() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().then(() => {
                    requestWakeLock();
                }).catch(err => {
                    console.log(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen().then(() => {
                        releaseWakeLock();
                    });
                }
            }
            hideSettings();
        });

        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                requestWakeLock();
            }
        });
    </script>
</body>
</html>
