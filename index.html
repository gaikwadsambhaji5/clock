<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scrolling Odometer Clock</title>
    <style>
        /* Base Reset & Optimization for Mobile */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0d0d12;
            color: #ffffff;
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Ambient Glow Background */
        .ambient-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(0,255,170,0.15) 0%, rgba(0,0,0,0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            animation: pulseGlow 4s infinite alternate ease-in-out;
        }

        @keyframes pulseGlow {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
        }

        /* Glassmorphism Clock Container */
        .clock-container {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 20px 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        /* The Scrolling Window for Digits */
        .digit-window {
            height: 120px; /* Shows previous, current, and next digits */
            overflow: hidden;
            position: relative;
            display: flex;
            margin: 0 2px;
            /* Gradient overlay to fade out top and bottom digits */
            mask-image: linear-gradient(to bottom, transparent 0%, black 35%, black 65%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 35%, black 65%, transparent 100%);
        }

        /* The moving strip of numbers */
        .digit-strip {
            display: flex;
            flex-direction: column;
            /* Hardware acceleration & Elastic bounce transition */
            transition: transform 0.8s cubic-bezier(0.5, -0.5, 0.2, 1.5);
            will-change: transform; 
        }

        .digit {
            height: 40px;
            line-height: 40px;
            font-size: 32px;
            font-weight: 700;
            text-align: center;
            width: 32px;
            color: #00ffaa;
            text-shadow: 0 0 15px rgba(0, 255, 170, 0.6);
        }

        .colon {
            font-size: 32px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.3);
            margin: 0 5px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        /* Design accent for Realme display */
        .brand-text {
            position: absolute;
            bottom: 30px;
            font-size: 10px;
            letter-spacing: 4px;
            color: rgba(255,255,255,0.3);
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <div class="clock-container" id="clock">
        <!-- Hours -->
        <div class="digit-window"><div class="digit-strip" id="h-tens"></div></div>
        <div class="digit-window"><div class="digit-strip" id="h-units"></div></div>
        
        <div class="colon">:</div>
        
        <!-- Minutes -->
        <div class="digit-window"><div class="digit-strip" id="m-tens"></div></div>
        <div class="digit-window"><div class="digit-strip" id="m-units"></div></div>
        
        <div class="colon">:</div>
        
        <!-- Seconds -->
        <div class="digit-window"><div class="digit-strip" id="s-tens"></div></div>
        <div class="digit-window"><div class="digit-strip" id="s-units"></div></div>
    </div>

    <div class="brand-text">Active Scroll Engine</div>

    <script>
        // Configuration
        const DIGIT_HEIGHT = 40; // Must match CSS height of .digit
        // Window is 120px, so 3 digits fit. To center the active digit, 
        // we offset by exactly one digit height (40px).
        const CENTER_OFFSET = DIGIT_HEIGHT; 

        // Generate the HTML for the number strips automatically
        function buildStrip(id, maxNumber) {
            const strip = document.getElementById(id);
            let html = '';
            for (let i = 0; i <= maxNumber; i++) {
                html += `<div class="digit">${i}</div>`;
            }
            strip.innerHTML = html;
        }

        // We render 0-9 for everything except the first hour/minute/second digits
        buildStrip('h-tens', 2);
        buildStrip('h-units', 9);
        buildStrip('m-tens', 5);
        buildStrip('m-units', 9);
        buildStrip('s-tens', 5);
        buildStrip('s-units', 9);

        // Function to move the strip to the correct number
        function updateStrip(id, value) {
            const strip = document.getElementById(id);
            // Calculate position: (Center Offset) - (Value * Digit Height)
            const translateY = CENTER_OFFSET - (value * DIGIT_HEIGHT);
            
            // translate3d forces the GPU to render the movement, saving CPU cycles
            strip.style.transform = `translate3d(0, ${translateY}px, 0)`;
        }

        function updateClock() {
            const now = new Date();
            
            // Format time into 2-digit strings (e.g., "09", "23")
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');

            // Apply to the UI
            updateStrip('h-tens', parseInt(hours[0]));
            updateStrip('h-units', parseInt(hours[1]));
            
            updateStrip('m-tens', parseInt(minutes[0]));
            updateStrip('m-units', parseInt(minutes[1]));
            
            updateStrip('s-tens', parseInt(seconds[0]));
            updateStrip('s-units', parseInt(seconds[1]));

            // requestAnimationFrame is much smoother and battery-friendly than setInterval
            requestAnimationFrame(updateClock);
        }

        // Initialize clock
        updateClock();
    </script>
</body>
</html>
