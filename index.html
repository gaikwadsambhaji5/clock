<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Scrolling Clock - Responsive Permanent Layout</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Orbitron:wght@700&family=Oswald:wght@700&family=Rajdhani:wght@700&family=Righteous&family=Rubik+Mono+One&family=Share+Tech+Mono&display=swap');
    </style>

    <style>
        @font-face {
            font-family: 'Teko Local';
            src: url('Teko-Bold.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Teko Local', sans-serif; 
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none; 
            -webkit-user-select: none;
            padding: 0 45px; 
            transition: font-family 0.3s ease;
        }

        /* --- HARDCODED HEADER LAYOUT --- */
        #header-positioner {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
            transform-origin: top center;
            z-index: 10;
            padding: 10px;
            /* Adjusted X to 0 for perfect centering, kept your slight scale */
            transform: translate(0px, 15px) scale(1.05, 1);
        }

        /* FUTURE-PROOFED HEADER: Spring-loaded spacing */
        .date-header {
            width: 86%; /* Reduced from 95% to ensure corners have empty space */
            display: flex;
            justify-content: space-between; 
            align-items: baseline;
            letter-spacing: 1px;
            line-height: 1;
            margin-bottom: 0px;
            font-variant-numeric: tabular-nums; 
            font-size: clamp(35px, 5.5vw, 55px); 
            white-space: nowrap; 
        }

        .pipe {
            font-size: 0.8em; 
            transform: translateY(-2px);
            opacity: 0.8; 
        }

        #date-num {
            display: inline-block;
            text-align: center;
        }
        
        #sec-num {
            display: inline-block;
            width: 1.2em; 
            text-align: right; 
        }

        .divider {
            width: 86%; /* Matches the date-header width to ensure corners have space */
            height: 5px;
            background-color: #ffffff;
            margin-bottom: 0px; 
        }

        /* --- HARDCODED CLOCK LAYOUT --- */
        #clock-positioner {
            display: flex;
            justify-content: center;
            align-items: center;
            transform-origin: top center;
            margin-top: 25px; 
            padding: 10px;
            /* Your custom coordinates for the time */
            transform: translate(-24px, -11px) scale(1.05, 0.9);
        }

        .time-container {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .digit-window {
            height: 380px; 
            width: 180px;  
            overflow: hidden;
            position: relative;
        }
        
        .tens-window {
            margin-right: 15px; 
        }

        .digit-strip {
            display: flex;
            flex-direction: column;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: transform;
        }

        .digit {
            height: 380px; 
            line-height: 380px;
            font-size: 480px; 
            width: 180px; 
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .separator {
            font-size: 300px; 
            line-height: 380px;
            font-weight: bold;
            margin: 0 10px; 
            transform: translateY(-35px); 
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* --- MENUS --- */
        .settings-overlay {
            display: none; 
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            padding: 40px 30px 30px 30px; 
            border-radius: 20px;
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            font-family: -apple-system, sans-serif;
            min-width: 320px;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            background: none;
            border: none;
            color: #ffffff;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            opacity: 0.7;
        }

        .settings-btn {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 12px 24px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
        }

        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            gap: 15px;
            font-size: 18px;
            font-weight: bold;
        }

        .custom-select {
            background: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 8px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            outline: none;
            width: 150px;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 28px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #555; transition: .4s;
            border-radius: 28px;
        }
        .slider:before {
            position: absolute; content: "";
            height: 20px; width: 20px;
            left: 4px; bottom: 4px;
            background-color: white; transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: #00ffaa; }
        input:checked + .slider:before { transform: translateX(22px); }

    </style>
</head>
<body>

    <div id="header-positioner">
        <div class="date-header">
            <span id="day-marathi">सोमवार</span> 
            <span class="pipe">|</span> 
            <span id="month-marathi">ऑगस्ट</span> 
            <span class="pipe">|</span> 
            <span id="date-num">10/08/2026</span>
            <span class="pipe">|</span> 
            <span id="sec-num">00</span>
        </div>
        <div class="divider"></div>
    </div>

    <div id="clock-positioner">
        <div class="time-container" id="clock">
            <div class="digit-window tens-window"><div class="digit-strip" id="h-tens"></div></div>
            <div class="digit-window"><div class="digit-strip" id="h-units"></div></div>
            <div class="separator">:</div>
            <div class="digit-window tens-window"><div class="digit-strip" id="m-tens"></div></div>
            <div class="digit-window"><div class="digit-strip" id="m-units"></div></div>
        </div>
    </div>

    <div class="settings-overlay" id="settings-menu">
        <button class="close-btn" id="close-settings">✕</button>
        <button class="settings-btn" id="fullscreen-btn">Toggle Full Screen</button>
        
        <div class="toggle-row">
            <span>Font Style</span>
            <select id="font-select" class="custom-select">
                <option value="'Teko Local', sans-serif">Teko (Local)</option>
                <option value="'Orbitron', sans-serif">Orbitron</option>
                <option value="'Bebas Neue', sans-serif">Bebas Neue</option>
                <option value="'Oswald', sans-serif">Oswald</option>
                <option value="'Rajdhani', sans-serif">Rajdhani</option>
                <option value="'Righteous', cursive">Righteous</option>
                <option value="'Share Tech Mono', monospace">Share Tech Mono</option>
                <option value="'Rubik Mono One', sans-serif">Rubik Mono</option>
                <option value="Impact, sans-serif">Impact</option>
                <option value="Arial, sans-serif">Arial Bold</option>
            </select>
        </div>

        <div class="toggle-row">
            <span>12-Hour Format</span>
            <label class="switch">
                <input type="checkbox" id="format-toggle">
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <script>
        // --- CLOCK ENGINE ---
        const DIGIT_HEIGHT = 380; 
        
        let is12Hour = localStorage.getItem('is12Hour') === 'true';
        let savedFont = localStorage.getItem('clockFont') || "'Teko Local', sans-serif";
        document.body.style.fontFamily = savedFont;
        document.getElementById('font-select').value = savedFont;

        const marathiDays = ["रविवार", "सोमवार", "मंगळवार", "बुधवार", "गुरुवार", "शुक्रवार", "शनिवार"];
        const marathiMonths = ["जानेवारी", "फेब्रुवारी", "मार्च", "एप्रिल", "मे", "जून", "जुलै", "ऑगस्ट", "सप्टेंबर", "ऑक्टोबर", "नोव्हेंबर", "डिसेंबर"];

        function buildStrip(id, maxNumber) {
            const strip = document.getElementById(id);
            let html = '';
            for (let i = 0; i <= maxNumber; i++) {
                html += `<div class="digit">${i}</div>`;
            }
            strip.innerHTML = html;
        }

        buildStrip('h-tens', 2);
        buildStrip('h-units', 9);
        buildStrip('m-tens', 5);
        buildStrip('m-units', 9);

        function updateStrip(id, value) {
            const strip = document.getElementById(id);
            const translateY = -(value * DIGIT_HEIGHT);
            strip.style.transform = `translate3d(0, ${translateY}px, 0)`;
        }

        function updateDateHeader(now) {
            const day = marathiDays[now.getDay()];
            const month = marathiMonths[now.getMonth()];
            const dd = String(now.getDate()).padStart(2, '0');
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const yyyy = now.getFullYear();
            const ss = String(now.getSeconds()).padStart(2, '0');

            document.getElementById('day-marathi').textContent = day;
            document.getElementById('month-marathi').textContent = month;
            document.getElementById('date-num').textContent = `${dd}/${mm}/${yyyy}`;
            document.getElementById('sec-num').textContent = ss;
        }

        function updateClock() {
            const now = new Date();
            let rawHours = now.getHours();
            
            if (is12Hour) {
                rawHours = rawHours % 12;
                rawHours = rawHours ? rawHours : 12; 
            }

            const hours = String(rawHours).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');

            updateStrip('h-tens', parseInt(hours[0]));
            updateStrip('h-units', parseInt(hours[1]));
            updateStrip('m-tens', parseInt(minutes[0]));
            updateStrip('m-units', parseInt(minutes[1]));

            updateDateHeader(now);
            requestAnimationFrame(updateClock);
        }

        updateClock();

        // --- SETTINGS & SCREEN WAKE LOGIC ---
        const settingsMenu = document.getElementById('settings-menu');
        const formatToggle = document.getElementById('format-toggle');
        const fontSelect = document.getElementById('font-select');
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        let hideTimeout;
        let wakeLock = null;

        formatToggle.checked = is12Hour;

        fontSelect.addEventListener('change', (e) => {
            document.body.style.fontFamily = e.target.value;
            localStorage.setItem('clockFont', e.target.value);
            resetHideTimer();
        });

        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try { wakeLock = await navigator.wakeLock.request('screen'); } 
                catch (err) { console.error(err); }
            }
        }

        function releaseWakeLock() {
            if (wakeLock !== null) { wakeLock.release().then(() => { wakeLock = null; }); }
        }

        function showSettings() {
            settingsMenu.style.display = 'flex';
            resetHideTimer();
        }

        function hideSettings() {
            settingsMenu.style.display = 'none';
            clearTimeout(hideTimeout);
        }

        function resetHideTimer() {
            clearTimeout(hideTimeout);
            hideTimeout = setTimeout(hideSettings, 10000); 
        }

        document.getElementById('close-settings').addEventListener('click', hideSettings);

        let tapCount = 0;
        let tapTimer;
        
        function handleTap(e) {
            if (e.target.closest('#settings-menu')) return; 
            
            tapCount++;
            clearTimeout(tapTimer);
            
            if (tapCount >= 5) {
                showSettings();
                tapCount = 0;
            } else {
                tapTimer = setTimeout(() => { tapCount = 0; }, 600); 
            }
        }

        document.body.addEventListener('touchend', handleTap);
        document.body.addEventListener('click', handleTap); 

        formatToggle.addEventListener('change', function(e) {
            is12Hour = e.target.checked;
            localStorage.setItem('is12Hour', is12Hour);
            resetHideTimer(); 
        });

        fullscreenBtn.addEventListener('click', function() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().then(() => {
                    requestWakeLock();
                }).catch(err => { console.log(err); });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen().then(() => {
                        releaseWakeLock();
                    });
                }
            }
            hideSettings();
        });

        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                requestWakeLock();
            }
        });
    </script>
</body>
</html>
