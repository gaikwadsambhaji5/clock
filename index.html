<script>
// =====================
// AUTO UPDATE (WORKING)
// =====================

const CHECK_URL = "index.html";
let lastETag = "";
let lastModified = "";

async function checkForUpdate() {
    try {
        const response = await fetch(CHECK_URL + "?t=" + Date.now(), {
            method: "HEAD",
            cache: "no-store"
        });

        const etag = response.headers.get("etag");
        const modified = response.headers.get("last-modified");

        if (!lastETag && !lastModified) {
            lastETag = etag;
            lastModified = modified;
            return;
        }

        if ((etag && etag !== lastETag) ||
            (modified && modified !== lastModified)) {

            location.reload();

        }

    } catch (e) {}
}

setInterval(checkForUpdate, 15000);
checkForUpdate();


// =====================
// KEEP SCREEN AWAKE
// =====================

let wakeLock = null;

async function keepAwake() {
    try {
        if ("wakeLock" in navigator) {
            wakeLock = await navigator.wakeLock.request("screen");
        }
    } catch (e) {}
}

keepAwake();

document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") {
        keepAwake();
    }
});


// =====================
// FULLSCREEN
// =====================

// IMPORTANT:
// Chrome on Android DOES NOT ALLOW webpages to enter fullscreen
// automatically. User interaction is required by the browser.
// No JavaScript can bypass this restriction.

document.addEventListener("click", () => {
    document.documentElement.requestFullscreen?.();
}, { once: true });

document.addEventListener("touchstart", () => {
    document.documentElement.requestFullscreen?.();
}, { once: true });

</script>
