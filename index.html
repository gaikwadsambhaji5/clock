<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Desk Clock</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
background:#000;
color:#fff;
overflow:hidden;
font-family:Arial,Helvetica,sans-serif;
}

body{
display:flex;
justify-content:center;
align-items:center;
}

body.hide-cursor{
cursor:none;
}

.container{
text-align:center;
width:100%;
transition:transform 3s ease-in-out;
}

#time{
font-size:20vw;
font-weight:bold;
letter-spacing:2px;
line-height:1;
font-variant-numeric:tabular-nums; /* Prevents horizontal jitter as numbers tick */
user-select:none;
}

#date{
font-size:4vw;
margin-top:20px;
color:#aaa;
user-select:none;
}

#day{
font-size:3vw;
margin-top:10px;
color:#666;
user-select:none;
}

</style>

</head>

<body>

<div class="container">

<div id="time"></div>

<div id="date"></div>

<div id="day"></div>

</div>

<script>

// =====================
// CLOCK (with 12/24 Hr Toggle)
// =====================

const days=[
"Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"
];

const months=[
"January","February","March","April","May","June",
"July","August","September","October","November","December"
];

let is24Hour = true;

function updateClock(){

const now=new Date();

let hNum = now.getHours();
let ampm = "";

if (!is24Hour) {
  ampm = hNum >= 12 ? " PM" : " AM";
  hNum = hNum % 12 || 12; // Convert 0 to 12
}

let h=String(hNum).padStart(2,"0");
let m=String(now.getMinutes()).padStart(2,"0");
let s=String(now.getSeconds()).padStart(2,"0");

document.getElementById("time").innerHTML=
`${h}:${m}<span style="font-size:8vw">:${s}${ampm}</span>`;

document.getElementById("date").textContent=
`${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`;

document.getElementById("day").textContent=
days[now.getDay()];

}

updateClock();
setInterval(updateClock,1000);

// Double-click to toggle 12/24 hour time format
document.body.addEventListener("dblclick", () => {
  is24Hour = !is24Hour;
  updateClock();
});

// =====================
// KEEP SCREEN AWAKE
// =====================

let wakeLock=null;

async function keepAwake(){

try{

if("wakeLock" in navigator){

wakeLock=await navigator.wakeLock.request("screen");

}

}catch(e){}

}

keepAwake();

document.addEventListener("visibilitychange",()=>{

if(document.visibilityState==="visible")
keepAwake();

});

// =====================
// FULLSCREEN
// =====================

document.body.onclick=()=>{

if(document.fullscreenElement) return;

document.documentElement.requestFullscreen().catch(()=>{});

};

// =====================
// HIDE CURSOR AFTER INACTIVITY
// =====================

let cursorTimer;
document.addEventListener("mousemove", () => {
  document.body.classList.remove("hide-cursor");
  clearTimeout(cursorTimer);
  cursorTimer = setTimeout(() => {
    document.body.classList.add("hide-cursor");
  }, 3000);
});

// =====================
// OLED BURN-IN PROTECTION (Pixel Shift)
// =====================

setInterval(() => {
  const x = Math.floor(Math.random() * 21) - 10; // -10px to +10px
  const y = Math.floor(Math.random() * 21) - 10;
  document.querySelector(".container").style.transform = `translate(${x}px, ${y}px)`;
}, 60000);

// =====================
// AUTO UPDATE CHECK (Every 5 Seconds)
// =====================

// Your GitHub Pages URL
const FILE_URL="https://gaikwadsambhaji5.github.io/clock/index.html";

let lastModified="";

async function checkUpdate(){

try{

const response=await fetch(FILE_URL,{
method:"HEAD",
cache:"no-cache"
});

const modified=response.headers.get("last-modified");

if(!lastModified){

lastModified=modified;

}else if(modified && modified!==lastModified){

// Forces a reliable reload in modern browsers without getting stuck on cache
window.location.href = window.location.pathname + "?updated=" + new Date().getTime();

}

}catch(e){}

}

// First check
checkUpdate();

// Check every 5 seconds (5000 ms)
setInterval(checkUpdate,5000);

</script>

</body>
</html>
