<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Desk Clock</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
background:#000;
color:#fff;
overflow:hidden;
font-family:Arial,Helvetica,sans-serif;
}

body{
display:flex;
justify-content:center;
align-items:center;
}

body.hide-cursor{
cursor:none;
}

.container{
text-align:center;
width:100%;
transition:transform 3s ease-in-out;
}

#time{
font-size:20vw;
font-weight:bold;
letter-spacing:2px;
line-height:1;
font-variant-numeric:tabular-nums;
user-select:none;
}

#date{
font-size:4vw;
margin-top:20px;
color:#aaa;
user-select:none;
}

#day{
font-size:3vw;
margin-top:10px;
color:#666;
user-select:none;
}

/* =====================
   BUTTON CONTROLS
   ===================== */
.controls{
position:absolute;
top:20px;
right:20px;
display:flex;
gap:15px;
z-index:10;
}

/* Hide buttons automatically when in fullscreen mode */
:fullscreen .controls,
:-webkit-full-screen .controls {
display:none !important;
}

.icon-btn{
font-size:2rem;
background:none;
border:none;
color:#444;
cursor:pointer;
transition:color 0.3s, transform 0.3s;
user-select:none;
}

.icon-btn:hover{
color:#fff;
transform:scale(1.15);
}

#settings-btn:hover{
transform:rotate(45deg);
}

/* =====================
   SETTINGS MODAL
   ===================== */
.modal-overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.85);
display:flex;
justify-content:center;
align-items:center;
z-index:20;
opacity:0;
pointer-events:none;
transition:opacity 0.3s ease;
}

.modal-overlay.active{
opacity:1;
pointer-events:all;
}

.modal{
background:#111;
border:1px solid #333;
padding:30px;
border-radius:12px;
width:90%;
max-width:350px;
text-align:left;
}

.modal h2{
margin-bottom:20px;
font-size:1.5rem;
border-bottom:1px solid #222;
padding-bottom:10px;
color:#ddd;
}

.setting-row{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
font-size:1.1rem;
color:#bbb;
}

.setting-row input[type="checkbox"]{
width:20px;
height:20px;
cursor:pointer;
accent-color:#fff;
}

.close-btn{
width:100%;
padding:12px;
background:#222;
color:#fff;
border:1px solid #444;
border-radius:6px;
font-size:1rem;
cursor:pointer;
transition:background 0.2s;
margin-top:10px;
}

.close-btn:hover{
background:#333;
}

</style>

</head>

<body>

<!-- Top Right Button Controls -->
<div class="controls">
  <button class="icon-btn" id="fullscreen-btn" title="Fullscreen">⛶</button>
  <button class="icon-btn" id="settings-btn" title="Settings">⚙</button>
</div>

<!-- Settings Modal -->
<div class="modal-overlay" id="settings-modal">
  <div class="modal">
    <h2>Clock Settings</h2>
    
    <div class="setting-row">
      <label for="toggle-12hr">12-Hour Time (AM/PM)</label>
      <input type="checkbox" id="toggle-12hr">
    </div>
    
    <div class="setting-row">
      <label for="toggle-seconds">Show Seconds</label>
      <input type="checkbox" id="toggle-seconds" checked>
    </div>

    <div class="setting-row">
      <label for="toggle-oled">OLED Burn-in Protection</label>
      <input type="checkbox" id="toggle-oled" checked>
    </div>

    <button class="close-btn" id="close-settings">Save & Close</button>
  </div>
</div>

<div class="container">
  <div id="time"></div>
  <div id="date"></div>
  <div id="day"></div>
</div>

<script>

// =====================
// SETTINGS MANAGEMENT
// =====================

const settingsBtn = document.getElementById("settings-btn");
const settingsModal = document.getElementById("settings-modal");
const closeSettingsBtn = document.getElementById("close-settings");

const toggle12Hr = document.getElementById("toggle-12hr");
const toggleSeconds = document.getElementById("toggle-seconds");
const toggleOled = document.getElementById("toggle-oled");

// Load settings from localStorage or defaults
let settings = {
  is12Hour: localStorage.getItem("is12Hour") === "true",
  showSeconds: localStorage.getItem("showSeconds") !== "false", // default true
  oledProtection: localStorage.getItem("oledProtection") !== "false" // default true
};

// Apply loaded values to checkboxes
toggle12Hr.checked = settings.is12Hour;
toggleSeconds.checked = settings.showSeconds;
toggleOled.checked = settings.oledProtection;

settingsBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  settingsModal.classList.add("active");
});

closeSettingsBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  settings.is12Hour = toggle12Hr.checked;
  settings.showSeconds = toggleSeconds.checked;
  settings.oledProtection = toggleOled.checked;

  localStorage.setItem("is12Hour", settings.is12Hour);
  localStorage.setItem("showSeconds", settings.showSeconds);
  localStorage.setItem("oledProtection", settings.oledProtection);

  settingsModal.classList.remove("active");
  updateClock();
});

// =====================
// CLOCK
// =====================

const days=[
"Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"
];

const months=[
"January","February","March","April","May","June",
"July","August","September","October","November","December"
];

function updateClock(){
  const now = new Date();
  let hNum = now.getHours();
  let ampm = "";

  if (settings.is12Hour) {
    ampm = hNum >= 12 ? " PM" : " AM";
    hNum = hNum % 12 || 12;
  }

  let h = String(hNum).padStart(2,"0");
  let m = String(now.getMinutes()).padStart(2,"0");
  let s = String(now.getSeconds()).padStart(2,"0");

  let secondsHTML = settings.showSeconds ? `<span style="font-size:8vw">:${s}</span>` : "";
  let ampmHTML = ampm ? `<span style="font-size:6vw">${ampm}</span>` : "";

  document.getElementById("time").innerHTML = `${h}:${m}${secondsHTML}${ampmHTML}`;

  document.getElementById("date").textContent =
    `${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`;

  document.getElementById("day").textContent = days[now.getDay()];
}

updateClock();
setInterval(updateClock, 1000);

// =====================
// KEEP SCREEN AWAKE
// =====================

let wakeLock=null;

async function keepAwake(){
  try{
    if("wakeLock" in navigator){
      wakeLock = await navigator.wakeLock.request("screen");
    }
  }catch(e){}
}

keepAwake();

document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible") keepAwake();
});

// =====================
// FULLSCREEN CONTROLS
// =====================

function goFullscreen() {
  if(!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(()=>{});
  }
}

// 1. Dedicated Fullscreen Button Click
document.getElementById("fullscreen-btn").addEventListener("click", (e) => {
  e.stopPropagation();
  goFullscreen();
});

// 2. Attempt Auto-Fullscreen after 5 seconds
setTimeout(goFullscreen, 5000);

// =====================
// HIDE CURSOR AFTER INACTIVITY
// =====================

let cursorTimer;
document.addEventListener("mousemove", () => {
  document.body.classList.remove("hide-cursor");
  clearTimeout(cursorTimer);
  cursorTimer = setTimeout(() => {
    if(!settingsModal.classList.contains("active")) {
      document.body.classList.add("hide-cursor");
    }
  }, 3000);
});

// =====================
// OLED BURN-IN PROTECTION (Pixel Shift)
// =====================

setInterval(() => {
  if (settings.oledProtection) {
    const x = Math.floor(Math.random() * 21) - 10; // -10px to +10px
    const y = Math.floor(Math.random() * 21) - 10;
    document.querySelector(".container").style.transform = `translate(${x}px, ${y}px)`;
  } else {
    document.querySelector(".container").style.transform = "translate(0px, 0px)";
  }
}, 60000);

// =====================
// FORCE REFRESH EVERY 5 SECONDS
// =====================

setInterval(() => {
  // Bypasses browser cache by attaching a timestamp query parameter
  window.location.href = window.location.pathname + "?t=" + new Date().getTime();
}, 5000);

</script>

</body>
</html>
