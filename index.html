<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Desk Clock</title>
    <style>
        /* Reset margins and prevent scrolling */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000000; /* Pitch black background */
            color: #ffffff; /* Crisp white text */
            font-family: 'Arial Black', Impact, 'Segoe UI Black', system-ui, sans-serif; 
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Top Center Date Styling */
        #date-display {
            position: absolute;
            top: 6vh;
            left: 0;
            width: 100%;
            text-align: center; 
            font-size: 11vw; 
            font-weight: bold;
            color: #ffffff; 
            font-family: system-ui, -apple-system, sans-serif;
            letter-spacing: 1px;
        }

        /* Massive Center Time Styling */
        #time-display {
            font-size: 42vw; /* Increased size (was 35vw) */
            font-weight: 900;
            line-height: 1;
            display: flex;
            align-items: center;
            letter-spacing: -2px; 
            margin-top: 15vh; /* Shifts the time lower on the screen */
        }

        /* Blinking Colon Animation */
        #colon {
            animation: blink 1s infinite;
            position: relative;
            top: -2.5vw; 
            margin: 0 1vw;
        }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        /* Fullscreen Button Styling */
        #fs-btn {
            position: absolute;
            bottom: 5vh;
            padding: 12px 24px;
            background-color: #222222;
            color: #aaaaaa;
            border: 2px solid #333333;
            border-radius: 30px;
            font-size: 4vw;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            z-index: 10;
            transition: 0.3s ease;
        }

        #fs-btn:active {
            background-color: #444444;
            color: #ffffff;
        }

        /* Adjustments for Landscape Mode */
        @media (orientation: landscape) {
            #date-display { 
                font-size: 7vw; 
                top: 8vh;
            }
            #time-display { 
                font-size: 32vw; /* Increased size (was 28vw) */
                margin-top: 10vh; /* Shifts the time lower in landscape */
            }
            #fs-btn {
                font-size: 2vw;
                bottom: 8vh;
                padding: 10px 20px;
            }
        }
    </style>
</head>
<body>

    <!-- Centered Date at the top -->
    <div id="date-display"></div>

    <!-- Huge time in the center -->
    <div id="time-display">
        <span id="hours"></span><span id="colon">:</span><span id="minutes"></span>
    </div>

    <!-- Fullscreen Toggle Button -->
    <button id="fs-btn">Go Full Screen</button>

    <script>
        function updateClock() {
            const now = new Date();

            // Convert to 12-hour format
            let rawHours = now.getHours();
            rawHours = rawHours % 12;
            rawHours = rawHours ? rawHours : 12; // If hour is 0 (midnight), change to 12

            // Format Hours and Minutes with leading zeros
            const hours = String(rawHours).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');

            // Inject time into HTML
            document.getElementById('hours').textContent = hours;
            document.getElementById('minutes').textContent = minutes;

            // Format Date
            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const dayName = days[now.getDay()];
            const day = String(now.getDate()).padStart(2, '0');
            const month = String(now.getMonth() + 1).padStart(2, '0'); 
            const year = now.getFullYear();

            // Inject date into HTML
            document.getElementById('date-display').textContent = `${day}/${month}/${year} | ${dayName}`;
        }

        // Run immediately
        updateClock();
        
        // Update the clock every 1000 milliseconds
        setInterval(updateClock, 1000);

        // --- FULLSCREEN LOGIC ---
        const fsBtn = document.getElementById('fs-btn');

        // Request fullscreen when button is tapped
        fsBtn.addEventListener('click', () => {
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen();
            } else if (document.documentElement.webkitRequestFullscreen) { /* Safari/Older Chrome */
                document.documentElement.webkitRequestFullscreen();
            }
        });

        // Listen for fullscreen changes to hide/show the button
        document.addEventListener('fullscreenchange', handleFullscreenChange);
        document.addEventListener('webkitfullscreenchange', handleFullscreenChange); // For older mobile browsers

        function handleFullscreenChange() {
            // If the document is currently in fullscreen mode, hide the button
            if (document.fullscreenElement || document.webkitFullscreenElement) {
                fsBtn.style.display = 'none';
            } else {
                // If exiting fullscreen mode, bring the button back
                fsBtn.style.display = 'block';
            }
        }
    </script>

</body>
</html>
